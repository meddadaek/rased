<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاحتياجات · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
<link href="css/home.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="page-head">
    <h1 data-ar="ما تحتاجه المناطق المتضرّرة" data-fr="Ce dont les zones touchées ont besoin"></h1>
    <p data-ar="لوحة احتياجات مفتوحة: اكتب ما ينقص منطقتك، أو تعهّد بتغطية حاجة قائمة. حين يتعهّد أحد بحاجة تخرج من قائمة المفتوح فورًا، حتى لا تصل شاحنتان بنفس الماء إلى نفس القرية بينما قرية أخرى تنتظر."
       data-fr="Un tableau des besoins ouvert : indiquez ce qui manque chez vous, ou engagez-vous sur un besoin existant. Dès qu'un besoin est pris en charge il quitte la liste ouverte, pour éviter que deux camions livrent la même eau au même village pendant qu'un autre attend."></p>
  </div>

  <div class="notice">
    <span data-ar="<b>هذه ليست منصّة تبرّع مالي.</b> لا تُطلب ولا تُجمع أي أموال هنا. للتنسيق الميداني الكامل للمساعدات العينية، منصّة <a href=&quot;https://habadz.life&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>هبة الجزائر</a> ومنصّة <a href=&quot;https://sanad-ca736.web.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>سند</a> تقومان بذلك."
          data-fr="<b>Ceci n'est pas une plateforme de dons financiers.</b> Aucun argent n'est demandé ni collecté ici. Pour la coordination complète de l'aide en nature, voir <a href=&quot;https://habadz.life&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>Hiba Algeria</a> et <a href=&quot;https://sanad-ca736.web.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>Sanad</a>."></span>
  </div>

  <div class="grid4" id="stats" style="margin-bottom:16px"></div>

  <div class="toolbar">
    <select class="wsel" id="wilayaSel"></select>
    <div class="segs" id="statusSegs"></div>
    <button class="btn" id="addBtn" data-ar="أضف حاجة" data-fr="Ajouter un besoin"></button>
  </div>

  <div class="card" id="addCard" hidden>
    <h3 data-ar="أضف حاجة" data-fr="Ajouter un besoin"></h3>
    <form id="needForm">
      <div class="grid2">
        <div class="field">
          <label data-ar="ما المطلوب" data-fr="Quoi"></label>
          <input id="fItem" maxlength="120" required>
          <div class="hint" data-ar="مثال: قارورات غاز، ماء، أغطية، أعلاف" data-fr="Ex. : bouteilles de gaz, eau, couvertures, fourrage"></div>
        </div>
        <div class="field">
          <label data-ar="الكمية" data-fr="Quantité"></label>
          <input id="fQty" maxlength="80">
        </div>
        <div class="field">
          <label data-ar="الولاية" data-fr="Wilaya"></label>
          <select id="fWilaya"></select>
        </div>
        <div class="field">
          <label data-ar="البلدية أو المكان" data-fr="Commune ou lieu"></label>
          <input id="fPlace" maxlength="160">
        </div>
        <div class="field">
          <label data-ar="هاتف للتنسيق" data-fr="Téléphone de coordination"></label>
          <input id="fPhone" maxlength="60" inputmode="tel">
          <div class="hint" data-ar="يُعرض علنًا حتى يتمكّن المتبرّعون من الاتصال بك." data-fr="Affiché publiquement pour que les donateurs puissent vous joindre."></div>
        </div>
        <div class="field">
          <label data-ar="الأولوية" data-fr="Priorité"></label>
          <select id="fUrgency">
            <option value="critical" data-ar="حرجة — خلال ساعات" data-fr="Critique — dans les heures"></option>
            <option value="urgent" data-ar="عاجلة — خلال اليوم" data-fr="Urgent — dans la journée"></option>
            <option value="normal" selected data-ar="عادية" data-fr="Normale"></option>
          </select>
        </div>
      </div>
      <div class="field">
        <label data-ar="تفاصيل" data-fr="Détails"></label>
        <textarea id="fNotes" maxlength="600"></textarea>
      </div>
      <button class="btn" type="submit" data-ar="أرسل" data-fr="Envoyer"></button>
      <span id="addMsg" style="margin-inline-start:10px;font-size:12px"></span>
    </form>
  </div>

  <div id="content"><div class="loading">…</div></div>
</div>

<footer class="foot">
  <span data-ar="البلاغات والاحتياجات يكتبها الناس، ولا تُتحقَّق آليًا. تأكّد بالاتصال قبل تحميل شاحنة."
        data-fr="Besoins et signalements sont saisis par le public et non vérifiés automatiquement. Confirmez par téléphone avant de charger un camion."></span>
</footer>

<script src="js/config.js?v=10"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script>
let NEEDS = null, GEO = null, SUMMARY = null;
let READONLY = false;
let fWilaya = "", fStatus = "open";

const STATUSES = [
  { v: "open",      ar: "مفتوحة",   fr: "Ouverts" },
  { v: "pledged",   ar: "متعهَّد بها", fr: "Pris en charge" },
  { v: "delivered", ar: "سُلِّمت",   fr: "Livrés" },
  { v: "",          ar: "الكل",     fr: "Tous" },
];

const URGENCY = {
  critical: { ar: "حرجة", fr: "Critique", cls: "u-crit" },
  urgent:   { ar: "عاجلة", fr: "Urgent",  cls: "u-urg" },
  normal:   { ar: "عادية", fr: "Normale", cls: "u-norm" },
};

const wname = (code) => {
  const g = GEO && GEO.features.find((x) => x.properties.code === code);
  return g ? wilayaName(g.properties) : "—";
};

const api = (path, opts) => fetch("/api/v1" + path, opts).then((r) => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
});

function fillWilayaSelects() {
  if (!GEO) return;
  const opts = GEO.features.slice()
    .sort((a, b) => wilayaName(a.properties).localeCompare(wilayaName(b.properties)))
    .map((g) => '<option value="' + g.properties.code + '">' +
      wilayaName(g.properties) + "</option>").join("");

  const sel = document.getElementById("wilayaSel");
  sel.innerHTML = '<option value="">' + (isAr() ? "كل الولايات" : "Toutes les wilayas") +
    "</option>" + opts;
  sel.value = fWilaya;

  const f = document.getElementById("fWilaya");
  const cur = f.value;
  f.innerHTML = '<option value="">—</option>' + opts;
  f.value = cur;
}

function renderStats() {
  if (!SUMMARY) return;
  const r = SUMMARY.relief, L = T();
  document.getElementById("stats").innerHTML =
    '<div class="stat ' + (r.needs_critical ? "danger" : "") + '"><b>' + n(r.needs_critical) + "</b>" +
      "<span>" + (isAr() ? "حاجة حرجة مفتوحة" : "besoins critiques ouverts") + "</span></div>" +
    '<div class="stat warn"><b>' + n(r.needs_open) + "</b>" +
      "<span>" + (isAr() ? "حاجة مفتوحة" : "besoins ouverts") + "</span></div>" +
    '<div class="stat"><b>' + n(r.offers_open) + "</b>" +
      "<span>" + (isAr() ? "عرض مساعدة" : "offres d'aide") + "</span></div>" +
    '<div class="stat good"><b>' + n(r.needs_delivered) + "</b>" +
      "<span>" + (isAr() ? "سُلِّمت" : "livrés") + "</span></div>";
}

function renderSegs() {
  document.getElementById("statusSegs").innerHTML = STATUSES.map((s) =>
    '<button class="seg' + (s.v === fStatus ? " on" : "") + '" data-v="' + s.v + '">' +
    (isAr() ? s.ar : s.fr) + "</button>").join("");
  document.querySelectorAll(".seg").forEach((b) =>
    b.addEventListener("click", () => { fStatus = b.dataset.v; load(); }));
}

function renderNeeds() {
  const L = T();
  const box = document.getElementById("content");
  if (!NEEDS) return;

  if (!NEEDS.needs.length) {
    box.innerHTML = '<div class="card"><p class="none">' +
      (isAr() ? "لا توجد احتياجات مسجّلة هنا بعد." : "Aucun besoin enregistré pour l'instant.") +
      "</p></div>";
    return;
  }

  box.innerHTML = '<div class="needlist">' + NEEDS.needs.map((x) => {
    const u = URGENCY[x.urgency] || URGENCY.normal;
    const where = [x.place, x.commune, wname(x.wilaya)].filter(Boolean).join("، ");
    const done = x.status === "delivered";
    return '<div class="need ' + u.cls + (done ? " done" : "") + '">' +
      '<div class="need-h">' +
        "<b>" + x.item + (x.quantity ? ' <span class="qty">' + x.quantity + "</span>" : "") + "</b>" +
        '<span class="upill">' + (isAr() ? u.ar : u.fr) + "</span>" +
      "</div>" +
      '<div class="need-w">' + (where || "—") + "</div>" +
      (x.notes ? '<div class="need-n">' + x.notes + "</div>" : "") +
      '<div class="need-f">' +
        (x.phone ? '<a class="need-tel" href="tel:' + x.phone + '">☎ ' + x.phone + "</a>" : "") +
        '<span class="need-st">' + (isAr() ? "الحالة: " : "État : ") +
          (STATUSES.find((s) => s.v === x.status) || {})[isAr() ? "ar" : "fr"] +
          (x.pledges ? " · " + n(x.pledges) + (isAr() ? " تعهّد" : " engagement(s)") : "") +
        "</span>" +
        (x.status === "open" && !READONLY
          ? '<button class="btn ghost pledge" data-id="' + x.id + '">' +
            (isAr() ? "أتعهّد بهذه" : "Je m'en charge") + "</button>"
          : "") +
        (x.status === "pledged" && !READONLY
          ? '<button class="btn ghost deliver" data-id="' + x.id + '">' +
            (isAr() ? "تم التسليم" : "Livré") + "</button>"
          : "") +
      "</div></div>";
  }).join("") + "</div>";

  document.querySelectorAll(".pledge").forEach((b) =>
    b.addEventListener("click", () => pledge(b.dataset.id)));
  document.querySelectorAll(".deliver").forEach((b) =>
    b.addEventListener("click", () => markDelivered(b.dataset.id)));
}

async function pledge(id) {
  const detail = prompt(isAr()
    ? "بماذا تتعهّد؟ (مثال: 30 قارورة غاز، شاحنة من سطيف)"
    : "Que fournissez-vous ? (ex. : 30 bouteilles, un camion depuis Sétif)");
  if (!detail) return;
  const phone = prompt(isAr() ? "هاتف للتواصل (اختياري)" : "Téléphone (facultatif)") || null;
  try {
    await api("/offers", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: "supply", detail, phone, need_id: +id }),
    });
    await load();
  } catch (e) {
    alert(T().needServer);
  }
}

async function markDelivered(id) {
  try {
    await api("/needs/" + id + "/status?status=delivered", { method: "POST" });
    await load();
  } catch (e) {
    alert(T().needServer);
  }
}

document.getElementById("addBtn").addEventListener("click", () => {
  const c = document.getElementById("addCard");
  c.hidden = !c.hidden;
});

document.getElementById("wilayaSel").addEventListener("change", (e) => {
  fWilaya = e.target.value;
  load();
});

document.getElementById("needForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("addMsg");
  const body = {
    item: document.getElementById("fItem").value,
    quantity: document.getElementById("fQty").value || null,
    wilaya: document.getElementById("fWilaya").value || null,
    commune: document.getElementById("fPlace").value || null,
    phone: document.getElementById("fPhone").value || null,
    urgency: document.getElementById("fUrgency").value,
    notes: document.getElementById("fNotes").value || null,
  };
  try {
    await api("/needs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    msg.style.color = "var(--hope)";
    msg.textContent = isAr() ? "تم التسجيل." : "Enregistré.";
    e.target.reset();
    document.getElementById("addCard").hidden = true;
    await load();
  } catch (err) {
    msg.style.color = "#B01F1F";
    msg.textContent = T().needServer;
  }
});

async function load() {
  try {
    const q = new URLSearchParams();
    if (fWilaya) q.set("wilaya", fWilaya);
    if (fStatus) q.set("status", fStatus);
    [NEEDS, SUMMARY] = await Promise.all([
      api("/needs?" + q.toString()),
      api("/summary"),
    ]);
    renderStats();
    renderNeeds();
    return;
  } catch (e) {
    // Static deployment: same verified needs, read-only.
    try {
      const all = await fetch(dataURL("needs.json")).then((r) => r.json());
      const rows = all.needs.filter((x) =>
        (!fWilaya || x.wilaya === fWilaya) && (!fStatus || x.status === fStatus));
      NEEDS = { needs: rows };
      SUMMARY = { relief: {
        needs_open: all.needs.filter((x) => x.status === "open").length,
        needs_critical: all.needs.filter((x) => x.status === "open" && x.urgency === "critical").length,
        needs_delivered: 0, offers_open: 0 } };
      READONLY = true;
      const btn = document.getElementById("addBtn");
      if (btn) btn.hidden = true;
      renderStats();
      renderNeeds();
    } catch (err) {
      document.getElementById("content").innerHTML =
        '<div class="notice danger">' + T().needServer + "</div>";
    }
  }
}

function redraw() {
  fillWilayaSelects();
  renderSegs();
  renderStats();
  renderNeeds();
  document.querySelectorAll("#fUrgency option").forEach((o) => {
    o.textContent = isAr() ? o.dataset.ar : o.dataset.fr;
  });
}

(async function () {
  initPage({ redraw });
  GEO = await loadWilayaGeo();
  redraw();
  await load();
})();
</script>
</body>
</html>
