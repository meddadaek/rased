<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كيف تحمي نفسك · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap wrap-narrow">
  <div class="page-head">
    <h1 data-ar="كيف تحمي نفسك وعائلتك" data-fr="Se protéger, soi et les siens"></h1>
    <p data-ar="إرشادات عامة للوقاية والتصرّف أثناء حرائق الغابات. التعليمات الرسمية أثناء أي حادث تأتي من الحماية المدنية، وهي التي تُتَّبع دائمًا."
       data-fr="Conseils généraux de prévention et de conduite à tenir lors d'un feu de forêt. Les consignes officielles pendant un incident viennent de la Protection civile et priment toujours."></p>
  </div>

  <div class="notice danger">
    <span data-ar="<b>الأرقام:</b> الحماية المدنية 14 أو 1021 · محافظة الغابات 1070 (للتبليغ عن حريق غابي) · الدرك الوطني 1055 · الشرطة 17. اتصل فور رؤية دخان — البلاغ المبكر يوفّر ساعات."
          data-fr="<b>Numéros :</b> Protection civile 14 ou 1021 · Conservation des forêts 1070 (signaler un feu de forêt) · Gendarmerie 1055 · Police 17. Appelez dès que vous voyez de la fumée — un signalement précoce fait gagner des heures."></span>
  </div>

  <div class="card">
    <h3 data-ar="قبل الموسم — الوقاية" data-fr="Avant la saison — prévention"></h3>
    <div class="steps">
      <div class="step"><span class="n">1</span><div>
        <b data-ar="أفرغ محيط المنزل" data-fr="Débroussailler autour de la maison"></b>
        <p data-ar="أزل الأعشاب اليابسة والأغصان المتراكمة في شريط حول البناء. معظم المنازل لا تشتعل من جبهة النار نفسها، بل من الجمرات المتطايرة التي تسقط على وقود جاف ملاصق للجدران."
           data-fr="Retirez herbes sèches et branchages sur une bande autour du bâtiment. La plupart des maisons ne s'enflamment pas au contact du front, mais à cause des braises projetées qui tombent sur des combustibles secs collés aux murs."></p></div></div>
      <div class="step"><span class="n">2</span><div>
        <b data-ar="أبعد ما يشتعل عن الجدران" data-fr="Éloigner ce qui brûle des murs"></b>
        <p data-ar="الحطب، قارورات الغاز، الوقود، الأثاث البلاستيكي — كلها تتحوّل إلى وقود ملاصق للمنزل. خزّنها بعيدًا."
           data-fr="Bois de chauffage, bouteilles de gaz, carburant, mobilier plastique : autant de combustibles collés à la maison. Stockez-les à distance."></p></div></div>
      <div class="step"><span class="n">3</span><div>
        <b data-ar="جهّز حقيبة واتفق على نقطة لقاء" data-fr="Préparer un sac et un point de rendez-vous"></b>
        <p data-ar="وثائق، أدوية، ماء، مصباح، شاحن، ملابس قطنية طويلة. واتفقوا مسبقًا أين تلتقي العائلة إن انقطع الاتصال — الشبكة تسقط كثيرًا أثناء الحرائق."
           data-fr="Papiers, médicaments, eau, lampe, chargeur, vêtements longs en coton. Convenez à l'avance d'un lieu de retrouvailles si le réseau tombe — c'est fréquent pendant les feux."></p></div></div>
      <div class="step"><span class="n">4</span><div>
        <b data-ar="اعرف مخرجين لا مخرجًا واحدًا" data-fr="Connaître deux sorties, pas une"></b>
        <p data-ar="الطريق الوحيد قد يُقطع بالنار أو بالدخان أو بازدحام المغادرين. اعرف مسارًا بديلًا وجرّبه فعليًا مرة."
           data-fr="L'unique route peut être coupée par le feu, la fumée ou l'embouteillage des départs. Repérez un itinéraire alternatif et empruntez-le au moins une fois."></p></div></div>
    </div>
  </div>

  <div class="card">
    <h3 data-ar="أثناء الحريق" data-fr="Pendant l'incendie"></h3>
    <div class="prose">
      <ul>
        <li data-ar="<b>اتصل بـ 14 فورًا</b> وحدّد المكان بأدق وصف ممكن: اسم المشتى أو الدوار، أقرب معلم، اتجاه الدخان."
            data-fr="<b>Appelez le 14 immédiatement</b> et localisez le plus précisément possible : nom du hameau, repère le plus proche, direction de la fumée."></li>
        <li data-ar="<b>لا تحاول عبور جبهة النار بالسيارة.</b> الدخان يُفقد الرؤية في ثوانٍ، والحرارة تكفي لإشعال المركبة. المغادرة تكون مبكرة أو لا تكون."
            data-fr="<b>Ne traversez jamais un front de feu en voiture.</b> La fumée supprime la visibilité en quelques secondes et la chaleur suffit à enflammer le véhicule. On part tôt, ou on ne part pas."></li>
        <li data-ar="<b>إن حوصرت، ابق في المبنى.</b> البناء يحميك من موجة الحرارة التي تمرّ عادة في دقائق. أغلق النوافذ والمصاريع، وأبعد الستائر."
            data-fr="<b>Si vous êtes cerné, restez dans le bâtiment.</b> Il vous protège de l'onde de chaleur, qui passe généralement en quelques minutes. Fermez fenêtres et volets, écartez les rideaux."></li>
        <li data-ar="<b>تنفّس عبر قماش مبلول</b> وابق منخفضًا حيث الهواء أنظف. أغلب الوفيات سببها الدخان لا اللهب."
            data-fr="<b>Respirez à travers un linge humide</b> et restez bas, où l'air est plus propre. La fumée tue plus que les flammes."></li>
        <li data-ar="<b>في العراء، اتجه إلى أرض محروقة أو عارية</b> — حقل محصود، طريق واسع، مجرى صخري. النار لا تعود إلى ما احترق."
            data-fr="<b>À découvert, gagnez une zone déjà brûlée ou nue</b> — champ moissonné, large route, lit rocheux. Le feu ne revient pas sur ce qui a brûlé."></li>
        <li data-ar="<b>لا تصعد المنحدر هربًا.</b> النار تتسارع صعودًا أسرع بكثير من الإنسان. تحرّك جانبيًا بعيدًا عن اتجاه الريح."
            data-fr="<b>Ne fuyez pas en montant.</b> Le feu accélère fortement en pente et va plus vite qu'un homme. Déplacez-vous latéralement, hors de l'axe du vent."></li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3 data-ar="بعد مرور النار" data-fr="Après le passage du feu"></h3>
    <div class="prose">
      <ul>
        <li data-ar="لا تعد إلى منطقة أُخليت قبل إذن الحماية المدنية. الأشجار المحترقة تسقط، والجذور تحت الرماد قد تبقى متّقدة أيامًا."
            data-fr="Ne revenez pas dans une zone évacuée avant l'autorisation de la Protection civile. Les arbres brûlés tombent et les racines sous la cendre peuvent rester incandescentes des jours."></li>
        <li data-ar="افحص السطح والشرفات بحثًا عن جمرات صغيرة — كثير من المنازل احترق بعد ساعات من مرور الجبهة."
            data-fr="Inspectez toiture et balcons à la recherche de braises — beaucoup de maisons brûlent des heures après le passage du front."></li>
        <li data-ar="لا تشرب ماء الصهاريج المكشوفة التي سقط فيها الرماد قبل التأكد."
            data-fr="Ne buvez pas l'eau des citernes ouvertes où sont tombées des cendres sans vérification."></li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3 data-ar="كيف تقرأ ألوان الخريطة" data-fr="Lire les couleurs de la carte"></h3>
    <div class="prose">
      <p data-ar="اللون يعبّر عن <b>احتمال أن تنتشر النار بسرعة إن اندلعت</b> — لا عن وجود حريق الآن. ولاية حمراء بلا أي حريق تعني: الغابة جافة والرياح قوية، وأي شرارة اليوم تصبح خطيرة بسرعة."
         data-fr="La couleur exprime <b>la vitesse à laquelle un feu se propagerait s'il démarrait</b> — pas la présence d'un feu maintenant. Une wilaya rouge sans aucun foyer signifie : forêt sèche et vent fort, la moindre étincelle devient vite dangereuse."></p>
      <p data-ar="ولهذا تبقى معظم الصحراء خضراء حتى في 45 درجة: الحرارة وحدها لا تكفي، لا بد من وقود نباتي يحمل النار."
         data-fr="C'est pourquoi le Sahara reste vert même à 45 °C : la chaleur seule ne suffit pas, il faut de la végétation pour porter le feu."></p>
    </div>
    <div class="grid3" id="scale" style="margin-top:6px"></div>
  </div>

  <div class="notice">
    <span data-ar="راصد أداة توعية وتخطيط. لا يصدر أوامر إخلاء ولا يحلّ محلّ بلاغ الحماية المدنية."
          data-fr="Rased est un outil de sensibilisation et de planification. Il n'émet pas d'ordre d'évacuation et ne remplace pas un appel à la Protection civile."></span>
  </div>
</div>

<footer class="foot">
  <span data-ar="إرشادات عامة متوافقة مع الممارسات المتّبعة في حرائق غابات البحر المتوسط. عند التعارض، تعليمات الحماية المدنية هي المرجع."
        data-fr="Conseils généraux conformes aux pratiques en vigueur pour les feux de forêt méditerranéens. En cas de divergence, les consignes de la Protection civile font foi."></span>
</footer>

<script src="js/config.js?v=10"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script>
function redraw() {
  const L = T();
  document.getElementById("scale").innerHTML = CLASS_SEQ.map((c) =>
    '<div class="stat" style="padding:10px 12px">' +
      '<span style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt)">' +
      '<i style="width:12px;height:12px;border-radius:3px;background:' + CLASS_COLORS[c] + '"></i>' +
      L.cls[c] + "</span></div>").join("");
}
initPage({ redraw });
redraw();
</script>
</body>
</html>
