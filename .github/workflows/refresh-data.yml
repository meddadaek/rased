name: Refresh fire and danger data

# Keeps the published site current without anyone running anything by hand.
#
# Every three hours is chosen to match the data, not to look busy: VIIRS and
# MODIS give roughly four usable passes over Algeria per day, and the danger
# index is a daily forecast. Running more often would re-download the same
# numbers and lean on free community services for nothing.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      skip_routing:
        description: "Skip OSRM road routing (much faster, drops drive times)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Satellite fire detections
        env:
          RASED_FIRMS_KEY: ${{ secrets.RASED_FIRMS_KEY }}
        run: |
          if [ -z "$RASED_FIRMS_KEY" ]; then
            echo "::error::RASED_FIRMS_KEY is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions."
            echo "::error::Get a free key (email only) at"
            echo "::error::https://firms.modaps.eosdis.nasa.gov/api/map_key/"
            exit 1
          fi
          python backend/app/firms.py --days 5

      - name: Weather and fire-danger index
        # Open-Meteo needs no key. This is the slower of the two fetches because
        # it pulls 99 days per wilaya to spin the moisture codes up properly.
        run: python backend/pipeline.py

      - name: Burned area per wilaya
        # Derived from the detection footprints already fetched, so this costs
        # no extra network — but it is the number people actually carry away
        # from a fire season, so it is not optional.
        run: python backend/burned.py

      - name: Orbital elements for the observing satellites
        # Cheap, keyless, and the globe propagates positions from these in the
        # browser — so refreshing them here keeps the live satellite tracking
        # accurate without the page ever calling Celestrak itself.
        run: python backend/build_tle.py || echo "::warning::TLE refresh failed; keeping the committed snapshot"

      - name: Exposure — who is near which fire
        run: |
          if [ "${{ inputs.skip_routing }}" = "true" ]; then
            python backend/build_exposure.py --no-route
          else
            python backend/build_exposure.py
          fi

      - name: Verify before committing
        run: |
          python3 - <<'PY'
          import json, sys
          fires = json.load(open("frontend/data/fires.json", encoding="utf-8"))
          if fires.get("source") == "MOCK":
              sys.exit("refusing to commit simulated fire data")
          veg = [f for f in fires["fires"] if f.get("category") != "industrial"]
          active = [f for f in veg if f.get("active")]
          print("::notice::%d vegetation fires, %d burning within %sh, %d new"
                % (len(veg), len(active), fires.get("active_hours", 6),
                   sum(1 for f in active if f.get("is_new"))))
          try:
              burned = json.load(open("frontend/data/burned.json", encoding="utf-8"))
              print("::notice::%.0f ha burned in the last 5 days"
                    % burned["totals"]["ha_120h"])
          except Exception:
              pass
          PY

      - name: Commit refreshed payloads
        run: |
          git config user.name "rased-bot"
          git config user.email "actions@github.com"
          git add frontend/data backend/app/fire_history.json
          if git diff --cached --quiet; then
            echo "No change since the last run — nothing to commit."
            exit 0
          fi
          # The fire history is committed alongside the payloads so that
          # "this fire is new" stays answerable across runs on a fresh runner.
          git commit -m "data: refresh fires and danger index [skip ci]"
          git push
