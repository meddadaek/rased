<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>راصد · Rased — الإنذار المبكر لحرائق الغابات في الجزائر</title>
<meta name="description" content="مؤشر خطر الحرائق ومتابعة البؤر النشطة عبر ولايات الجزائر الـ48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">

</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap">

  <!-- ── hero ───────────────────────────────────────────────── -->
  <section class="hero">
    <div class="hero-txt">
      <h1 data-ar="نعرف أين ستشتعل، قبل أن تشتعل."
          data-fr="Savoir où le feu va partir, avant qu'il ne parte."></h1>
      <p data-ar="راصد يحسب خطر اندلاع حرائق الغابات في ولايات الجزائر الـ48 من بيانات طقس حقيقية، ويتابع البؤر النشطة بالأقمار الاصطناعية، ويقول لك من هم السكان القريبون منها ومن أقرب من يستطيع الوصول إليهم."
         data-fr="Rased calcule le danger d'incendie sur les 48 wilayas à partir de données météo réelles, suit les foyers actifs par satellite, et indique qui se trouve à proximité et qui peut les atteindre le plus vite."></p>
      <div class="hero-cta">
        <a class="btn" href="map.html" data-ar="افتح الخريطة" data-fr="Ouvrir la carte"></a>
        <a class="btn ghost" href="report.html" data-ar="بلّغ عن حريق" data-fr="Signaler un feu"></a>
      </div>
    </div>
    <div class="hero-em">
      <div class="hero-em-t" data-ar="عند رؤية حريق" data-fr="Si vous voyez un feu"></div>
      <a href="tel:14" class="hero-num"><b>14</b><span data-ar="الحماية المدنية" data-fr="Protection civile"></span></a>
      <a href="tel:1021" class="hero-num"><b>1021</b><span data-ar="الحماية المدنية" data-fr="Protection civile"></span></a>
      <a href="tel:1055" class="hero-num"><b>1055</b><span data-ar="الدرك الوطني" data-fr="Gendarmerie"></span></a>
      <a href="tel:1070" class="hero-num"><b>1070</b><span data-ar="محافظة الغابات — للتبليغ عن حريق" data-fr="Conservation des forêts — signaler un feu"></span></a>
    </div>
  </section>

  <!-- ── live situation ─────────────────────────────────────── -->
  <section class="live" id="live">
    <div class="live-head">
      <h2 data-ar="الوضع الآن" data-fr="La situation maintenant"></h2>
      <span class="live-stamp" id="liveStamp"></span>
    </div>
    <div class="grid4" id="liveStats"><div class="loading">…</div></div>
    <div id="liveHot"></div>
  </section>

  <!-- ── cards ──────────────────────────────────────────────── -->
  <section class="cards" id="cards"></section>

  <!-- ── how it works, short ────────────────────────────────── -->
  <section class="card" style="margin-top:8px">
    <h3 data-ar="من أين تأتي الأرقام" data-fr="D'où viennent les chiffres"></h3>
    <div class="prose">
      <p data-ar="خطر الاشتعال محسوب بمؤشر الطقس الحرائقي الكندي (FWI) — نفس المنظومة التي تعتمدها أوروبا في حوض المتوسط — من طقس حقيقي مع تراكم جفاف على 72 يومًا. البؤر النشطة من أقمار NASA. السكان والمستشفيات والجمعيات ووحدات الحماية المدنية من OpenStreetMap. أزمنة الوصول محسوبة على شبكة الطرق الحقيقية."
         data-fr="Le danger est calculé avec l'Indice Forêt-Météo canadien (FWI) — le système utilisé en Europe sur le bassin méditerranéen — à partir de météo réelle et d'un cumul de sécheresse sur 72 jours. Les foyers viennent des satellites NASA. Population, hôpitaux, associations et unités de la Protection civile viennent d'OpenStreetMap. Les temps d'accès sont calculés sur le réseau routier réel."></p>
    </div>
    <a href="about.html" class="morelink" data-ar="الطريقة وحدودها ←" data-fr="La méthode et ses limites →"></a>
  </section>

  <div class="notice danger" style="margin-top:6px">
    <span data-ar="<b>راصد ليس أمر إخلاء.</b> هو أداة توعية وتخطيط. القرار الميداني للحماية المدنية وحدها."
          data-fr="<b>Rased n'est pas un ordre d'évacuation.</b> C'est un outil de sensibilisation et de planification. La décision opérationnelle relève de la seule Protection civile."></span>
  </div>
</div>

<footer class="foot">
  <span data-ar="مفتوح المصدر · الطقس: Open-Meteo · البؤر: NASA FIRMS · الخرائط: OpenStreetMap و OpenFreeMap · الحدود: geoBoundaries (ODbL) · المسارات: OSRM"
        data-fr="Open source · Météo : Open-Meteo · Foyers : NASA FIRMS · Cartes : OpenStreetMap et OpenFreeMap · Limites : geoBoundaries (ODbL) · Itinéraires : OSRM"></span>
</footer>

<script src="js/i18n.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/welcome.js?v=10"></script>
<script>
let FIRES = null, EXPO = null, RISK = null, GEO = null;

const CARDS = [
  { href: "map.html",     icon: "🗺️", ar: ["خريطة الوضع", "البؤر النشطة وخطر كل ولاية على خريطة واحدة"],
                                        fr: ["Carte de situation", "Foyers actifs et danger par wilaya sur une seule carte"] },
  { href: "fires.html",   icon: "🔥", ar: ["الحرائق النشطة", "كل بؤرة مشتعلة الآن، مرتّبة حسب الخطر على السكان"],
                                        fr: ["Foyers actifs", "Chaque foyer en cours, classé par danger pour les habitants"] },
  { href: "wilayas.html", icon: "📊", ar: ["توقّع الخطر", "خطر الاشتعال في الولايات الـ48 إلى سبعة أيام"],
                                        fr: ["Prévision du danger", "Le risque sur les 48 wilayas à sept jours"] },
  { href: "report.html",  icon: "📍", ar: ["بلّغ عن حريق", "بلاغك يُقارن آليًا برصد الأقمار الاصطناعية"],
                                        fr: ["Signaler un feu", "Votre signalement est recoupé avec les satellites"] },
  { href: "needs.html",   icon: "📦", ar: ["الاحتياجات", "ما ينقص المناطق المتضرّرة، وتعهّد بتغطيته"],
                                        fr: ["Besoins", "Ce qui manque aux zones touchées, et s'y engager"] },
  { href: "shelters.html",icon: "🏠", ar: ["مراكز الإيواء", "أين تُستقبل العائلات التي أُجليت"],
                                        fr: ["Hébergement", "Où sont accueillies les familles évacuées"] },
  { href: "aid.html",     icon: "🤝", ar: ["الجمعيات والمساعدة", "أقرب مستشفى وجمعية ووحدة حماية مدنية من موقعك"],
                                        fr: ["Associations et secours", "Hôpital, association et caserne les plus proches"] },
  { href: "routes.html",  icon: "🚚", ar: ["دليل القوافل والطرق", "احسب مسار قافلتك وتحقّق إن كان يمرّ قرب نار"],
                                        fr: ["Convois et itinéraires", "Calculez le trajet et vérifiez s'il longe un feu"] },
  { href: "animals.html", icon: "🐑", ar: ["الحيوانات والمواشي", "علف وماء ورعاية بيطرية، وأقرب طبيب بيطري"],
                                        fr: ["Animaux et cheptel", "Fourrage, eau, soins et vétérinaire le plus proche"] },
  { href: "prepare.html", icon: "🛡️", ar: ["كيف تحمي نفسك", "ما تفعله قبل الحريق وأثناءه وبعده"],
                                        fr: ["Se protéger", "Quoi faire avant, pendant et après un incendie"] },
];

function renderCards() {
  document.getElementById("cards").innerHTML = CARDS.map((c) => {
    const [title, desc] = isAr() ? c.ar : c.fr;
    return '<a class="hcard" href="' + c.href + '">' +
      '<span class="hcard-i">' + c.icon + "</span>" +
      "<b>" + title + "</b><p>" + desc + "</p>" +
      '<span class="hcard-go">' + (isAr() ? "←" : "→") + "</span></a>";
  }).join("");
}

function renderLive() {
  const L = T();
  const box = document.getElementById("liveStats");

  if (!FIRES) { box.innerHTML = '<div class="loading">…</div>'; return; }

  // Only fires a satellite has seen recently. Anything older has most likely
  // been put out, and calling it "burning now" on a homepage would be a lie.
  const veg = FIRES.fires.filter((f) => f.category !== "industrial");
  const active = veg.filter((f) => f.active);
  const brandNew = active.filter((f) => f.is_new);

  const expoById = {};
  if (EXPO) EXPO.fires.forEach((e) => { expoById[e.id] = e; });
  const pop5 = active.reduce((a, f) => a + (expoById[f.id] ? expoById[f.id].rings.r5.pop : 0), 0);

  // Worst wilaya by forecast danger, not by fire count: the point of the page
  // is that danger precedes fire.
  let worst = null;
  if (RISK && GEO) {
    for (const g of GEO.features) {
      const w = RISK.wilayas[g.properties.code];
      if (!w) continue;
      const d = w.days[0];
      if (!worst || d.fwi > worst.fwi) worst = { fwi: d.fwi, cls: d.class, p: g.properties };
    }
  }

  box.innerHTML =
    '<div class="stat ' + (active.length ? "danger" : "good") + '"><b>' + n(active.length) + "</b>" +
      "<span>" + (isAr() ? "بؤرة مشتعلة الآن" : "foyers en cours") +
      "<br>" + (isAr() ? "رُصدت خلال 6 ساعات" : "vus dans les 6 dernières heures") + "</span></div>" +
    '<div class="stat ' + (brandNew.length ? "warn" : "") + '"><b>' + n(brandNew.length) + "</b>" +
      "<span>" + (isAr() ? "اندلعت حديثًا" : "nouveaux départs") +
      "<br>" + (isAr() ? "لم تكن موجودة سابقًا" : "absents du relevé précédent") + "</span></div>" +
    '<div class="stat danger"><b>' + nInt(pop5) + "</b>" +
      "<span>" + L.people + "<br>" + L.within5 + " " + L.atRisk + "</span></div>" +
    (worst
      ? '<div class="stat"><b style="color:' + CLASS_COLORS[worst.cls] + '">' + wilayaName(worst.p) + "</b>" +
        "<span>" + (isAr() ? "أعلى خطر اليوم" : "danger le plus élevé") +
        "<br>FWI " + n(worst.fwi.toFixed(0)) + " · " + L.cls[worst.cls] + "</span></div>"
      : "");

  document.getElementById("liveStamp").textContent =
    new Date(FIRES.generated_at).toLocaleString(L.locale,
      { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  // The largest fires still burning, with who is near them.
  const hot = active
    .map((f) => ({ f, e: expoById[f.id] }))
    .sort((a, b) => b.f.frp_total - a.f.frp_total)
    .slice(0, 4);

  const wname = (code) => {
    const g = GEO && GEO.features.find((x) => x.properties.code === code);
    return g ? wilayaName(g.properties) : "—";
  };

  document.getElementById("liveHot").innerHTML = !hot.length ? "" :
    '<div class="hotlist">' + hot.map(({ f, e }) => {
      const near = e ? e.rings.r5.nearest.slice(0, 2).map((p) => p.name).filter(Boolean).join("، ") : "";
      const st = e && e.station;
      return '<a class="hotrow" href="wilaya.html?code=' + (f.wilaya || "") + '">' +
        '<span class="hotdot"></span>' +
        '<span class="hotmain"><b>' + wname(f.wilaya) + "</b>" +
          (near ? "<span>" + near + "</span>" : "") + "</span>" +
        '<span class="hotnum">' + n(Math.round(f.frp_total)) + " MW" +
          "<small>" + (isAr() ? "مشتعلة منذ " : "en cours depuis ") +
          n(Math.round(f.burning_hours)) + (isAr() ? " سا" : " h") + "</small></span>" +
        (st && st.route
          ? '<span class="hotnum"><b style="color:var(--ember)">' + n(st.route.min) + " " + L.min +
            "</b><small>" + L.nearestStation + "</small></span>"
          : "") +
        (f.is_new ? '<span class="pill grow">' + (isAr() ? "جديدة" : "nouveau") + "</span>" : "") +
      "</a>";
    }).join("") + "</div>";
}

/* Relief figures only exist when the API is up. On a static deployment this
   block simply never renders, rather than showing zeros that look like
   "nobody needs anything". */
function renderRelief(r) {
  if (!r) return;
  const host = document.getElementById("liveHot");
  host.insertAdjacentHTML("beforebegin",
    '<div class="grid4" style="margin-top:10px">' +
      '<div class="stat ' + (r.needs_critical ? "danger" : "") + '"><b>' + n(r.needs_critical) + "</b>" +
        "<span>" + (isAr() ? "حاجة حرجة مفتوحة" : "besoins critiques") + "</span></div>" +
      '<div class="stat warn"><b>' + n(r.needs_open) + "</b><span>" +
        (isAr() ? "حاجة مفتوحة" : "besoins ouverts") + "</span></div>" +
      '<div class="stat"><b>' + n(r.shelters) + "</b><span>" +
        (isAr() ? "مركز إيواء مدرَج" : "centres listés") + "</span></div>" +
      '<div class="stat good"><b>' + n(r.offers_open) + "</b><span>" +
        (isAr() ? "عرض مساعدة" : "offres d'aide") + "</span></div>" +
    "</div>");
}

function redraw() { renderCards(); renderLive(); }

(async function () {
  initPage({ redraw });
  redraw();

  // First visit only: explain what this is before showing them a map of fires.
  maybeShowWelcome(LANG, (l) => setPageLang(l));
  try {
    [FIRES, GEO, RISK] = await Promise.all([loadFires(), loadWilayaGeo(), loadRisk()]);
    renderLive();
    try {
      const sum = await fetch("/api/v1/summary").then((r) => r.json());
      renderRelief(sum.relief);
    } catch (e) { /* static hosting has no API; the fire panel still works */ }
    try { EXPO = await loadExposure(); renderLive(); } catch (e) { /* optional */ }
  } catch (err) {
    document.getElementById("liveStats").innerHTML =
      '<div class="notice danger">' + err.message + "</div>";
  }
})();
</script>
</body>
</html>
