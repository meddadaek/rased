<script src="https://unpkg.com/cesium@1.144.0/Build/Cesium/Cesium.js"></script>
<!-- SGP4 orbit propagation, so the satellites are computed live in the browser
     rather than polled from anywhere. -->
<script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script src="js/config.js?v=14"></script>
<script src="js/i18n.js?v=14"></script>
<script src="js/common.js?v=14"></script>
<script src="js/globe.js?v=14"></script>
<script src="js/satellites.js?v=14"></script>
<script>
let RISK = null, FIRES = null, EXPO = null, GEO = null, EXPO_BY_ID = {};
let BURNED = null;
let show = { fires: true, danger: true, sats: true, burned: false };
let SELECTED = null;

/* How far back the globe looks. Six hours is "burning now" — that is the
   window a satellite pass can actually vouch for. The wider windows are for
   reading the last day or two, which is what you want when the fires are out
   and you are trying to see where they were. */
const WINDOWS = [6, 12, 24, 48];
let winH = 6;

const wname = (code) => {
  const g = GEO && GEO.features.find((x) => x.properties.code === code);
  return g ? wilayaName(g.properties) : "—";
};

const vegFires = () =>
  FIRES ? FIRES.fires.filter((f) => f.category !== "industrial") : [];

const inWindow = (h) => vegFires().filter((f) => f.last_seen_h <= h);

/* Open on the tightest window that actually contains something. Landing on an
   empty globe reads as broken even when "nothing is burning" is the honest
   and welcome answer. */
function defaultWindow() {
  for (const h of WINDOWS) if (inWindow(h).length) return h;
  return 48;
}

/* ─── chrome ──────────────────────────────────────────────────────── */

function renderChrome() {
  document.getElementById("tagline").textContent =
    isAr() ? "مراقبة حرائق الغابات · الجزائر" : "Surveillance des feux · Algérie";
  document.getElementById("hudNav").innerHTML = NAV.map((x) =>
    '<a href="' + x.href + '"' + (x.href === "index.html" ? ' class="on"' : "") +
    ">" + x[LANG] + "</a>").join("");
  document.querySelectorAll(".hud-lang").forEach((b) =>
    b.classList.toggle("on", b.dataset.lang === LANG));

  document.getElementById("hLive").textContent = isAr() ? "الوضع الآن" : "Situation";
  document.getElementById("hFires").textContent = isAr() ? "البؤر المرصودة" : "Foyers détectés";
  document.getElementById("hRisk").textContent = isAr() ? "أعلى خطر اليوم" : "Danger le plus élevé";
  document.getElementById("emLabel").textContent =
    isAr() ? "عند رؤية حريق" : "Si vous voyez un feu";
  document.getElementById("tourStop").textContent = isAr() ? "إيقاف" : "Arrêter";

  document.getElementById("keyHint").innerHTML = [
    ["Space", isAr() ? "جولة" : "Survol"],
    ["H", isAr() ? "الجزائر" : "Algérie"],
    ["F", isAr() ? "البؤر" : "Foyers"],
    ["D", isAr() ? "الخطر" : "Danger"],
  ].map(([k, l]) => "<span><kbd>" + k + "</kbd>" + l + "</span>").join("");

  document.getElementById("toggles").innerHTML = [
    { k: "fires",  ar: "البؤر", fr: "Foyers" },
    { k: "danger", ar: "طبقة الخطر", fr: "Couche de danger" },
    { k: "sats",   ar: "الأقمار", fr: "Satellites" },
    { k: "burned", ar: "المحترق", fr: "Brûlé" },
  ].map((t) =>
    '<button class="tgl' + (show[t.k] ? " on" : "") + '" data-k="' + t.k + '">' +
    (isAr() ? t.ar : t.fr) + "</button>").join("") +
    '<button class="tgl' + (tourRunning() ? " on" : "") + '" id="tourBtn">' +
      (isAr() ? "جولة" : "Survol") + "</button>" +
    '<button class="tgl" id="homeBtn">' + (isAr() ? "الجزائر" : "Algérie") + "</button>";

  document.querySelectorAll(".tgl[data-k]").forEach((b) =>
    b.addEventListener("click", () => toggleLayer(b.dataset.k)));
  document.getElementById("homeBtn").addEventListener("click", () => {
    stopTour(); onTourEnd(); flyHome();
  });
  document.getElementById("tourBtn").addEventListener("click", toggleTour);
}

function toggleLayer(k) {
  show[k] = !show[k];
  if (k === "fires") setFiresVisible(show.fires);
  if (k === "danger") setDangerVisible(show.danger);
  if (k === "sats") setSatellitesVisible(show.sats);
  if (k === "burned") {
    setBurnedVisible(show.burned);
    // The two shaded layers cannot both be on: one is forecast danger, the
    // other is realised damage, and stacked they read as a single meaningless
    // colour field.
    if (show.burned && show.danger) { show.danger = false; setDangerVisible(false); }
  }
  if (k === "danger" && show.danger && show.burned) {
    show.burned = false; setBurnedVisible(false);
  }
  renderChrome();
}

/* ─── burned area ─────────────────────────────────────────────────── */

/* The damage panel. This is the part of the page that answers the question
   people actually carry away from a fire season — not where it is burning
   tonight, but what the country lost this week. */
const BURN_WINDOWS = [24, 48, 120];
let burnWin = 120;

const burnKey = () => "ha_" + burnWin + "h";

function burnWindowLabel(h) {
  if (h < 48) return isAr() ? "24 ساعة" : "24 h";
  if (h < 120) return isAr() ? "يومان" : "2 j";
  return isAr() ? "5 أيام" : "5 j";
}

function haText(ha) {
  // Below a thousand hectares the exact figure is meaningful; above it, the
  // precision is false and the magnitude is the point.
  if (ha >= 1000) return nInt(Math.round(ha / 100) * 100);
  return nInt(ha);
}

function renderBurn() {
  if (!BURNED) return;

  document.getElementById("hBurn").textContent =
    isAr() ? "المساحات المحترقة" : "Surfaces brûlées";

  const total = BURNED.totals[burnKey()] || 0;
  document.getElementById("burnTotal").innerHTML =
    "<b>" + haText(total) + "</b><span>" +
    (isAr() ? "هكتار خلال " + burnWindowLabel(burnWin)
            : "hectares en " + burnWindowLabel(burnWin)) + "</span>";

  document.getElementById("burnChips").innerHTML = BURN_WINDOWS.map((h) =>
    '<button class="wchip' + (h === burnWin ? " on" : "") + '" data-burn="' + h + '">' +
    burnWindowLabel(h) + "<i>" + haText(BURNED.totals["ha_" + h + "h"] || 0) +
    "</i></button>").join("");

  document.querySelectorAll("[data-burn]").forEach((b) =>
    b.addEventListener("click", () => setBurnWindow(+b.dataset.burn)));

  const rows = Object.values(BURNED.wilayas)
    .filter((w) => (w[burnKey()] || 0) > 0)
    .sort((a, b) => (b[burnKey()] || 0) - (a[burnKey()] || 0))
    .slice(0, 8);

  const max = rows.length ? rows[0][burnKey()] : 1;

  document.getElementById("burnList").innerHTML = !rows.length
    ? '<p class="rail-none">' +
        (isAr() ? "لا مساحات محترقة مسجّلة." : "Aucune surface brûlée relevée.") + "</p>"
    : rows.map((w) => {
        const ha = w[burnKey()] || 0;
        const pct = Math.max(3, Math.round((ha / max) * 100));
        return '<button class="burn-row" data-wburn="' + w.code + '">' +
          '<span class="br-bar" style="width:' + pct + '%"></span>' +
          '<span class="br-name">' + (isAr() ? w.name_ar : w.name_fr) + "</span>" +
          '<span class="br-ha">' + haText(ha) +
            "<i>" + (isAr() ? "هكتار" : "ha") + "</i></span>" +
        "</button>";
      }).join("");

  document.querySelectorAll("[data-wburn]").forEach((b) =>
    b.addEventListener("click", () => {
      stopTour(); onTourEnd();
      if (!show.burned) toggleLayer("burned");
      const feat = GEO.features.find((f) => f.properties.code === b.dataset.wburn);
      if (feat) flyToWilaya(feat);
    }));

  /* Say what the number is. An area figure with no method behind it invites
     being quoted as an official damage assessment, which this is not. */
  document.getElementById("burnFoot").textContent = isAr()
    ? "أرض رآها القمر تحترق فعلًا — حدّ أدنى، لا حصيلة رسمية. الحرائق التي تندلع وتنطفئ بين مرورين لا تُحتسب."
    : "Sol vu en feu par satellite — un minimum, pas un bilan officiel. Les feux nés et éteints entre deux passages ne comptent pas.";
}

async function setBurnWindow(h) {
  burnWin = h;
  await setBurnedWindow(dataURL("wilayas.geojson"), BURNED.wilayas, burnKey(), show.burned);
  renderBurn();
}

/* ─── satellites ──────────────────────────────────────────────────── */

/* The spacecraft that produce every detection on this map, and when the next
   one is due over the fire belt. This is the part of the system that is
   genuinely live — the positions are propagated in the browser from orbital
   elements, second by second, with nothing being fetched. */
function renderSatRail() {
  document.getElementById("hSat").textContent =
    isAr() ? "أقمار الرصد" : "Satellites d'observation";

  const rows = overpasses();
  const list = document.getElementById("satList");

  if (!rows.length) {
    list.innerHTML = '<p class="rail-none">' +
      (isAr() ? "تعذّر حساب المدارات." : "Orbites indisponibles.") + "</p>";
    document.getElementById("satFoot").textContent = "";
    return;
  }

  list.innerHTML = rows.map((r) => {
    const overhead = r.overhead;
    const when = !r.next ? "—"
      : r.next.minutes < 1
        ? (isAr() ? "الآن" : "maintenant")
        : r.next.minutes < 60
          ? (isAr() ? "بعد " + n(Math.round(r.next.minutes)) + " د"
                    : "dans " + n(Math.round(r.next.minutes)) + " min")
          : (isAr() ? "بعد " + n((r.next.minutes / 60).toFixed(1)) + " سا"
                    : "dans " + n((r.next.minutes / 60).toFixed(1)) + " h");

    return '<button class="rail-row" data-sat="' + r.meta.short + '">' +
      '<span class="rr-dot' + (overhead ? " beat" : "") + '" style="background:' +
        (r.meta.sensor === "VIIRS" ? "#4FC3F7" : "#B39DDB") + '"></span>' +
      '<span class="rr-main"><b>' + (isAr() ? r.meta.name_ar : r.meta.name_fr) +
        "</b><i>" + r.meta.sensor + " · " +
        (overhead ? (isAr() ? "فوق الجزائر الآن" : "au-dessus maintenant")
                  : (isAr() ? "المرور القادم" : "prochain passage")) + "</i></span>" +
      '<span class="rr-num' + (overhead ? " live" : "") + '">' + when + "</span>" +
    "</button>";
  }).join("");

  document.querySelectorAll("[data-sat]").forEach((b) =>
    b.addEventListener("click", () => {
      stopTour(); onTourEnd();
      if (!show.sats) toggleLayer("sats");
      flyToSatellite(b.dataset.sat);
    }));

  /* The caveat that makes the rest of the numbers readable: this system only
     knows what the last overpass saw. */
  document.getElementById("satFoot").textContent = isAr()
    ? "لا تُرصد الحرائق إلا أثناء مرور قمر. بين المرورين، الخريطة تعرض آخر ما رُئي."
    : "Les feux ne sont vus qu'au passage d'un satellite. Entre deux passages, la carte montre le dernier relevé.";
}

/* ─── imagery ─────────────────────────────────────────────────────── */

/* Which picture of the ground is on the globe. The Esri base is sharp but it
   is a mosaic stitched over months; the NASA layers are the actual pass from a
   named day, which is where smoke and burn scars live. */
let imgKind = null;
let imgDate = gibsDefaultDate();

const IMG_OPTS = [
  { k: null,        ar: "قمر صناعي",   fr: "Satellite" },
  { k: "truecolor", ar: "لون طبيعي",   fr: "Couleur réelle" },
  { k: "fire",      ar: "حرائق وآثار", fr: "Feux et cicatrices" },
];

function renderImagery() {
  document.getElementById("imgH").textContent =
    isAr() ? "صورة الأرض" : "Imagerie";

  document.getElementById("imagery").innerHTML = IMG_OPTS.map((o) =>
    '<button class="tgl' + (o.k === imgKind ? " on" : "") + '" data-img="' +
    (o.k || "") + '">' + (isAr() ? o.ar : o.fr) + "</button>").join("");

  document.querySelectorAll("[data-img]").forEach((b) =>
    b.addEventListener("click", () => setImagery(b.dataset.img || null)));

  const row = document.getElementById("dateRow");
  row.hidden = !imgKind;
  if (imgKind) {
    document.getElementById("dLabel").textContent =
      new Date(imgDate + "T12:00:00Z").toLocaleDateString(T().locale,
        { day: "numeric", month: "short" });
  }
}

function setImagery(kind) {
  imgKind = kind;
  setGibs(kind, imgDate);
  renderImagery();
}

/* Step the imagery day by day. GIBS keeps a full archive, so walking backwards
   shows the burn scar growing across the days the fire was running — which is
   the clearest answer there is to "how much of the forest went". */
function stepDate(days) {
  const d = new Date(imgDate + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  const iso = d.toISOString().slice(0, 10);
  // Never walk into the future: the pass has not happened yet.
  if (iso > gibsDefaultDate()) return;
  imgDate = iso;
  if (imgKind) setGibs(imgKind, imgDate);
  renderImagery();
}

document.getElementById("dPrev").addEventListener("click", () => stepDate(-1));
document.getElementById("dNext").addEventListener("click", () => stepDate(1));

function stamp() {
  if (!FIRES) return;
  const live = FIRES.source !== "MOCK";
  const b = document.getElementById("srcBadge");
  b.textContent = live ? "LIVE" : "MOCK";
  b.className = live ? "live" : "";
  /* Age, not a timestamp: "checked 4 minutes ago" answers the question a
     visitor is actually asking, which is whether this thing is still running. */
  const mins = Math.max(0, Math.round((Date.now() - new Date(FIRES.generated_at)) / 60000));
  document.getElementById("stampTime").textContent = mins < 60
    ? (isAr() ? "قبل " + n(mins) + " د" : "il y a " + n(mins) + " min")
    : (isAr() ? "قبل " + n(Math.round(mins / 60)) + " سا"
              : "il y a " + n(Math.round(mins / 60)) + " h");
}

/* ─── rail ────────────────────────────────────────────────────────── */

function renderRail() {
  if (!FIRES) return;

  const act = inWindow(6);                    // burning now, by satellite
  const shown = inWindow(winH);               // what the globe is drawing
  const brandNew = act.filter((f) => f.is_new).length;
  const pop = shown.reduce((a, f) =>
    a + (EXPO_BY_ID[f.id] ? EXPO_BY_ID[f.id].rings.r5.pop : 0), 0);

  const extreme = RISK
    ? Object.values(RISK.wilayas).filter((w) =>
        w.days[0].class === "extreme" || w.days[0].class === "very_high").length
    : 0;

  document.getElementById("liveStats").innerHTML =
    stat(n(act.length), isAr() ? "بؤرة مشتعلة" : "foyers en cours",
         isAr() ? "رُصدت خلال 6 ساعات" : "vus dans les 6 h", act.length ? "hot" : "calm") +
    stat(n(extreme), isAr() ? "ولاية في خطر شديد" : "wilayas en danger élevé",
         isAr() ? "مؤشر الخطر اليوم" : "indice du jour", extreme ? "warn" : "") +
    stat(nInt(pop), isAr() ? "نسمة" : "habitants",
         isAr() ? "ضمن 5 كلم من بؤرة" : "à moins de 5 km d'un foyer", pop ? "warn" : "");

  /* When nothing is burning, say so plainly and say when the last detection
     was. A fire map that goes quiet is reporting good news, and it should read
     that way rather than looking like it failed to load. */
  const veg = vegFires();
  const note = document.getElementById("liveNote");
  if (!act.length && veg.length) {
    const last = Math.min.apply(null, veg.map((f) => f.last_seen_h));
    note.className = "rail-note calm";
    note.innerHTML = isAr()
      ? "<b>لا بؤرة مشتعلة الآن.</b> آخر رصد قبل " + n(last.toFixed(1)) +
        " ساعة. الخطر يبقى مرتفعًا — البؤر تنطفئ، الظروف لا."
      : "<b>Aucun foyer en cours.</b> Dernière détection il y a " +
        n(last.toFixed(1)) + " h. Le danger reste élevé — les feux s'éteignent, pas les conditions.";
  } else if (act.length) {
    note.className = "rail-note";
    note.textContent = brandNew
      ? (isAr() ? n(brandNew) + " منها اندلعت منذ الرصد السابق."
                : n(brandNew) + " nouveaux départs depuis le relevé précédent.")
      : (isAr() ? "لا اندلاع جديد منذ الرصد السابق."
                : "Aucun nouveau départ depuis le relevé précédent.");
  } else {
    note.className = "rail-note";
    note.textContent = "";
  }

  // Window scrubber.
  document.getElementById("winChips").innerHTML = WINDOWS.map((h) =>
    '<button class="wchip' + (h === winH ? " on" : "") + '" data-win="' + h + '">' +
    n(h) + (isAr() ? " سا" : " h") +
    "<i>" + n(inWindow(h).length) + "</i></button>").join("");
  document.querySelectorAll("[data-win]").forEach((b) =>
    b.addEventListener("click", () => setWindow(+b.dataset.win)));

  // Strongest detections inside the window.
  const top = shown.slice().sort((a, b) => b.frp_total - a.frp_total).slice(0, 6);
  document.getElementById("fireList").innerHTML = !top.length
    ? '<p class="rail-none">' +
        (isAr() ? "لا بؤر في هذه المدة." : "Aucun foyer sur cette période.") + "</p>"
    : top.map((f) => {
        const e = EXPO_BY_ID[f.id];
        const c = f.last_seen_h <= 2 ? "#FFD166" : f.last_seen_h <= 6 ? "#E4572E" : "#8E4B2E";
        return '<button class="rail-row" data-fire="' + f.id + '">' +
          '<span class="rr-dot" style="background:' + c + '"></span>' +
          '<span class="rr-main"><b>' + wname(f.wilaya) + "</b>" +
            "<i>" + (e && e.rings.r5.pop ? nInt(e.rings.r5.pop) + " " + (isAr() ? "نسمة" : "hab.")
                                         : (isAr() ? "منطقة خالية" : "zone inhabitée")) + "</i></span>" +
          '<span class="rr-num">' + n(Math.round(f.frp_total)) + "<i>MW</i></span>" +
        "</button>";
      }).join("");

  document.querySelectorAll("[data-fire]").forEach((b) =>
    b.addEventListener("click", () => {
      const f = FIRES.fires.find((x) => x.id === b.dataset.fire);
      if (f) { stopTour(); onTourEnd(); flyToFire(f); showTarget(f); }
    }));

  // Highest forecast danger — the point being that danger precedes fire.
  if (RISK && GEO) {
    const rows = GEO.features.map((g) => {
      const w = RISK.wilayas[g.properties.code];
      return w ? { p: g.properties, d: w.days[0] } : null;
    }).filter(Boolean).sort((a, b) => b.d.fwi - a.d.fwi).slice(0, 6);

    document.getElementById("riskList").innerHTML = rows.map((r) =>
      '<a class="rail-row" href="wilaya.html?code=' + r.p.code + '">' +
        '<span class="rr-dot" style="background:' + CLASS_COLORS[r.d.class] + '"></span>' +
        '<span class="rr-main"><b>' + wilayaName(r.p) + "</b><i>" + T().cls[r.d.class] + "</i></span>" +
        '<span class="rr-num" style="color:' + CLASS_COLORS[r.d.class] + '">' +
          n(r.d.fwi.toFixed(0)) + "</span>" +
      "</a>").join("");
  }
}

const stat = (v, label, sub, cls) =>
  '<div class="rail-stat ' + (cls || "") + '"><b>' + v + "</b>" +
  "<span>" + label + "<i>" + sub + "</i></span></div>";

function setWindow(h) {
  winH = h;
  stopTour();
  onTourEnd();
  addFires(FIRES.fires, winH);
  setFiresVisible(show.fires);
  renderRail();
}

/* ─── target readout ──────────────────────────────────────────────── */

function showTarget(f) {
  const e = EXPO_BY_ID[f.id];
  SELECTED = f;

  document.getElementById("tId").textContent = f.id;
  document.getElementById("tWilaya").textContent = wname(f.wilaya);

  // State first: whether this one is still going is the whole question.
  const live = f.last_seen_h <= 6;
  const st = document.getElementById("tState");
  st.className = "target-state " + (live ? "live" : "out");
  st.textContent = live
    ? (isAr() ? "مرصودة ضمن آخر 6 ساعات" : "Détecté dans les 6 dernières heures")
    : (isAr() ? "لم تُرصد منذ " + n(f.last_seen_h.toFixed(1)) + " ساعة"
              : "Plus détecté depuis " + n(f.last_seen_h.toFixed(1)) + " h");

  const cells = [
    [n(Math.round(f.frp_total)) + " MW", isAr() ? "الطاقة الإشعاعية" : "Puissance"],
    [n(f.detections), isAr() ? "عمليات رصد" : "Détections"],
    [n(Math.round(f.burning_hours)) + (isAr() ? " سا" : " h"), isAr() ? "امتدّت على" : "Étalé sur"],
    [n(f.last_seen_h.toFixed(1)) + (isAr() ? " سا" : " h"), isAr() ? "آخر رصد" : "Dernier passage"],
  ];
  if (e) {
    cells.push([nInt(e.rings.r5.pop), isAr() ? "نسمة ضمن 5 كلم" : "hab. dans 5 km"]);
    if (e.station && e.station.route) {
      cells.push([n(e.station.route.min) + (isAr() ? " د" : " min"),
                  isAr() ? "أقرب وحدة إطفاء" : "Caserne la plus proche"]);
    }
  }
  document.getElementById("tGrid").innerHTML = cells.map(function (c) {
    return '<div class="tcell"><b>' + c[0] + "</b><span>" + c[1] + "</span></div>";
  }).join("");

  const near = e ? e.rings.r5.nearest.slice(0, 4) : [];
  document.getElementById("tNear").innerHTML = !near.length ? "" :
    '<div class="tnear-h">' + (isAr() ? "أقرب التجمعات" : "Localités les plus proches") + "</div>" +
    near.map((p) => '<span class="tchip">' + p.name + " · " + n(p.km.toFixed(1)) +
      (isAr() ? " كلم" : " km") + "</span>").join("");

  if (pixelsOn) showDetections(f);
  renderTargetActions();
  document.getElementById("target").hidden = false;
}

/* ─── the evidence behind a fire ──────────────────────────────────── */

/* Every fire on this map is a cluster of satellite pixels. These two buttons
   let a reader go and look at them: fly down to the ground, and draw each
   detection at its true footprint with the sensor and minute that recorded
   it. It is the difference between being told and being shown. */
function renderTargetActions() {
  const f = SELECTED;
  const nDet = f && f.points ? f.points.length : 0;

  document.getElementById("tInspect").textContent =
    isAr() ? "اقترب من الموقع" : "Descendre sur le site";

  const btn = document.getElementById("tPixels");
  btn.className = pixelsOn ? "on" : "";
  btn.disabled = !nDet;
  btn.textContent = nDet
    ? (isAr() ? "بكسلات الرصد (" + n(nDet) + ")"
              : "Pixels détectés (" + n(nDet) + ")")
    : (isAr() ? "لا تفاصيل بكسل" : "Pas de détail pixel");

  const box = document.getElementById("tDets");
  if (!pixelsOn || !nDet) { box.innerHTML = ""; return; }

  // The most recent handful, newest first: which satellite, how long ago, how
  // hot, and how big the pixel on the ground actually was.
  box.innerHTML =
    '<div class="tnear-h">' +
      (isAr() ? "آخر عمليات الرصد" : "Dernières détections") + "</div>" +
    f.points.slice(0, 6).map((p) => {
      const sat = p.sat.replace(/_NRT$/, "").replace(/_/g, " ");
      return '<div class="detrow">' +
        "<b>" + sat + "</b>" +
        "<span>" + (isAr() ? "قبل " + n(p.age_h.toFixed(1)) + " سا"
                           : "il y a " + n(p.age_h.toFixed(1)) + " h") + "</span>" +
        "<i>" + n(p.frp.toFixed(1)) + " MW · " +
          n((p.scan * 1000).toFixed(0)) + (isAr() ? " م" : " m") + "</i>" +
      "</div>";
    }).join("") +
    '<p class="detnote">' + (isAr()
      ? "كل مستطيل هو بكسل واحد من المستشعر، مرسوم بحجمه الحقيقي على الأرض."
      : "Chaque rectangle est un pixel du capteur, à sa taille réelle au sol.") +
    "</p>";
}

let pixelsOn = false;

document.getElementById("tInspect").addEventListener("click", () => {
  if (!SELECTED) return;
  stopTour(); onTourEnd();
  if (!pixelsOn) togglePixels();
  inspectFire(SELECTED);
});

document.getElementById("tPixels").addEventListener("click", togglePixels);

function togglePixels() {
  if (!SELECTED) return;
  pixelsOn = !pixelsOn;
  if (pixelsOn) showDetections(SELECTED);
  else clearDetections();
  renderTargetActions();
}

function hideTarget() {
  document.getElementById("target").hidden = true;
  clearDetections();
  pixelsOn = false;
  SELECTED = null;
}

document.getElementById("targetClose").addEventListener("click", hideTarget);

/* ─── guided tour ─────────────────────────────────────────────────── */

function toggleTour() {
  if (tourRunning()) { stopTour(); onTourEnd(); return; }

  const list = inWindow(winH).slice()
    .sort((a, b) => b.frp_total - a.frp_total).slice(0, 8);
  if (!list.length) return;

  startTour(list, (f, i, total) => {
    showTarget(f);
    document.getElementById("tourBar").hidden = false;
    document.getElementById("tourText").textContent =
      (isAr() ? "جولة " : "Survol ") + n(i) + "/" + n(total) + " · " + wname(f.wilaya);
  }, onTourEnd);
  renderChrome();
}

function onTourEnd() {
  document.getElementById("tourBar").hidden = true;
  renderChrome();
}

document.getElementById("tourStop").addEventListener("click", () => {
  stopTour(); onTourEnd();
});

/* ─── keyboard ────────────────────────────────────────────────────── */

document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("input, textarea")) return;
  const k = ev.key.toLowerCase();
  if (ev.code === "Space") { ev.preventDefault(); toggleTour(); }
  else if (k === "h") { stopTour(); onTourEnd(); flyHome(); }
  else if (k === "f") toggleLayer("fires");
  else if (k === "d") toggleLayer("danger");
  else if (k === "escape") { stopTour(); onTourEnd(); hideTarget(); }
  else if (["1", "2", "3", "4"].indexOf(k) >= 0) setWindow(WINDOWS[+k - 1]);
});

/* ─── live refresh ────────────────────────────────────────────────── */

/* The payloads are regenerated server-side on a schedule. A tab left open on a
   wall screen should pick that up on its own rather than showing yesterday's
   fires until somebody presses reload — which is exactly the failure mode a
   monitoring tool cannot have. */
const POLL_MS = 5 * 60 * 1000;

async function refresh() {
  try {
    const [risk, fires] = await Promise.all([loadRisk(), loadFires()]);
    const changed = !FIRES || fires.generated_at !== FIRES.generated_at;
    RISK = risk;
    FIRES = fires;

    if (changed) {
      try {
        EXPO = await loadExposure();
        EXPO_BY_ID = {};
        EXPO.fires.forEach((e) => { EXPO_BY_ID[e.id] = e; });
      } catch (e) { /* exposure is an enrichment, not a requirement */ }
      try {
        BURNED = await getJSON(null, dataURL("burned.json"));
        await setBurnedWindow(dataURL("wilayas.geojson"), BURNED.wilayas,
                              burnKey(), show.burned);
      } catch (e) { /* keep the previous damage figures */ }

      // A window that has gone empty since the last poll would leave the globe
      // blank, so fall back to the tightest one that still holds something.
      if (!inWindow(winH).length) winH = defaultWindow();
      addFires(FIRES.fires, winH);
      setFiresVisible(show.fires);
      flashUpdated();
    }
    redraw();
  } catch (e) {
    /* A failed poll is not worth disturbing the display over; the age on the
       badge will visibly grow and the next poll will try again. */
    console.warn("refresh failed:", e.message);
  }
}

function flashUpdated() {
  const b = document.getElementById("srcBadge");
  b.classList.add("pulse");
  setTimeout(() => b.classList.remove("pulse"), 2400);
}

/* ─── boot ────────────────────────────────────────────────────────── */

function boot(msg) { document.getElementById("bootText").textContent = msg; }

function redraw() {
  renderChrome();
  renderImagery();
  stamp();
  renderRail();
  renderBurn();
  renderSatRail();
  if (SELECTED) renderTargetActions();
}

(function () {
  applyDir();
  onLangChange(redraw);
  document.querySelectorAll(".hud-lang").forEach((b) =>
    b.addEventListener("click", () => setPageLang(b.dataset.lang)));
})();

(async function () {
  boot(isAr() ? "جارٍ تجهيز المجسّم…" : "Préparation du globe…");

  try {
    await buildViewer("cesium");
  } catch (err) {
    document.getElementById("boot").innerHTML =
      '<div class="boot-err">' + (isAr()
        ? "تعذّر تشغيل العرض ثلاثي الأبعاد على هذا الجهاز. "
        : "Impossible de démarrer la vue 3D sur cet appareil. ") +
      '<a href="fires.html">' + (isAr() ? "افتح قائمة البؤر بدل ذلك" : "Ouvrir la liste des foyers") +
      "</a></div>";
    return;
  }

  boot(isAr() ? "جارٍ تحميل البيانات…" : "Chargement des données…");
  [GEO, RISK, FIRES] = await Promise.all([loadWilayaGeo(), loadRisk(), loadFires()]);
  try {
    EXPO = await loadExposure();
    EXPO.fires.forEach((e) => { EXPO_BY_ID[e.id] = e; });
  } catch (e) { /* exposure is an enrichment, not a requirement */ }

  try {
    BURNED = await getJSON(null, dataURL("burned.json"));
  } catch (e) { console.warn("burned-area data unavailable:", e.message); }

  boot(isAr() ? "رسم طبقة الخطر…" : "Rendu de la couche de danger…");
  await addDangerLayer(dataURL("wilayas.geojson"), RISK.wilayas, CLASS_COLORS,
    (fuel) => ({ forest: 0.34, steppe: 0.20, desert: 0.05 }[fuel] ?? 0.05));

  if (BURNED) {
    boot(isAr() ? "حساب المساحات المحترقة…" : "Calcul des surfaces brûlées…");
    await addBurnedLayer(dataURL("wilayas.geojson"), BURNED.wilayas, burnKey());
  }

  winH = defaultWindow();
  addFires(FIRES.fires, winH);
  onFirePick((f) => { if (f) { stopTour(); onTourEnd(); showTarget(f); flyToFire(f); } });

  /* Orbits are computed locally, so this costs one small file and no ongoing
     network at all. If it fails the rest of the globe is unaffected. */
  boot(isAr() ? "حساب مدارات الأقمار…" : "Calcul des orbites…");
  try {
    await loadSatellites();
    addSatellites();
    setSatellitesVisible(show.sats);
    startSatelliteClock(renderSatRail);
  } catch (e) {
    console.warn("satellite tracking unavailable:", e.message);
  }

  redraw();
  document.getElementById("boot").classList.add("gone");

  // The opening shot runs once the data is on the globe, so the country
  // arrives already carrying its fires rather than filling in afterwards.
  cinematicIntro();

  setInterval(refresh, POLL_MS);
  setInterval(stamp, 30000);      // let the age on the badge tick up
})();
</script>
