<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحيوانات والمواشي · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
<link href="css/home.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="page-head">
    <h1 data-ar="الحيوانات والمواشي" data-fr="Animaux et cheptel"></h1>
    <p data-ar="بعد الحريق يحترق المرعى قبل البيوت. الماشية هي دخل العائلة، والحيوانات الأليفة تُترك خلفها في الإجلاء. هذه الصفحة لطلب العلف والماء والرعاية البيطرية، ولإيجاد أقرب طبيب بيطري."
       data-fr="Après un incendie, les pâturages brûlent avant les maisons. Le cheptel est le revenu de la famille, et les animaux domestiques sont laissés lors des évacuations. Cette page sert à demander fourrage, eau et soins vétérinaires, et à trouver le vétérinaire le plus proche."></p>
  </div>

  <div class="notice">
    <span data-ar="لا توجد منصّة إغاثة جزائرية تتابع احتياجات الحيوانات بشكل منفصل — تُدرج عادةً تحت «أخرى» فتضيع. هنا لها تصنيف خاص حتى تصبح قابلة للعدّ، وبالتالي قابلة للتمويل."
          data-fr="Aucune plateforme de secours algérienne ne suit les besoins animaliers séparément — ils sont classés sous « autre » et disparaissent. Ici ils ont leur propre catégorie, donc ils deviennent comptables, et donc finançables."></span>
  </div>

  <div class="grid4" id="stats" style="margin-bottom:18px"></div>

  <!-- ── animal types ─────────────────────────────────────────────── -->
  <div class="card">
    <h3 data-ar="ما نوع الحيوان؟" data-fr="Quel animal ?"></h3>
    <div class="animals" id="animalGrid"></div>
    <div id="animalDetail"></div>
  </div>

  <!-- ── report a need ────────────────────────────────────────────── -->
  <div class="card">
    <h3 data-ar="اطلب مساعدة لحيواناتك" data-fr="Demander de l'aide pour vos animaux"></h3>
    <form id="needForm">
      <div class="grid2">
        <div class="field">
          <label data-ar="ما المطلوب" data-fr="Quoi"></label>
          <input id="fItem" maxlength="120" required>
          <div class="hint" data-ar="مثال: تبن وشعير لـ40 رأس غنم، ماء، علاج حروق" data-fr="Ex. : foin et orge pour 40 moutons, eau, soins de brûlures"></div>
        </div>
        <div class="field">
          <label data-ar="نوع الحاجة" data-fr="Type de besoin"></label>
          <select id="fCat">
            <option value="animal_feed" data-ar="علف وماء" data-fr="Fourrage et eau"></option>
            <option value="animal_care" data-ar="رعاية بيطرية" data-fr="Soins vétérinaires"></option>
          </select>
        </div>
        <div class="field">
          <label data-ar="العدد التقريبي" data-fr="Nombre approximatif"></label>
          <input id="fQty" maxlength="80">
        </div>
        <div class="field">
          <label data-ar="الولاية" data-fr="Wilaya"></label>
          <select id="fWilaya"></select>
        </div>
        <div class="field">
          <label data-ar="البلدية أو المكان" data-fr="Commune ou lieu"></label>
          <input id="fPlace" maxlength="160">
        </div>
        <div class="field">
          <label data-ar="هاتف للتنسيق" data-fr="Téléphone de coordination"></label>
          <input id="fPhone" maxlength="60" inputmode="tel">
        </div>
      </div>
      <div class="field">
        <label data-ar="تفاصيل" data-fr="Détails"></label>
        <textarea id="fNotes" maxlength="600"></textarea>
      </div>
      <button class="btn" type="submit" data-ar="أرسل الطلب" data-fr="Envoyer"></button>
      <span id="addMsg" style="margin-inline-start:10px;font-size:12px"></span>
    </form>
  </div>

  <!-- ── open animal needs ────────────────────────────────────────── -->
  <div class="card">
    <h3 data-ar="طلبات مفتوحة للحيوانات" data-fr="Demandes ouvertes pour les animaux"></h3>
    <div id="needs"><div class="loading">…</div></div>
  </div>

  <!-- ── vets ─────────────────────────────────────────────────────── -->
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:18px 20px 0"><h3 data-ar="أقرب طبيب بيطري" data-fr="Vétérinaire le plus proche"></h3></div>
    <div class="minimap" id="map" style="height:340px;border:0;border-radius:0;margin-top:12px">
      <div class="minimap-hint" id="mapHint"></div>
    </div>
    <div class="maptools">
      <button class="btn" id="geoBtn"></button>
      <button class="btn ghost" id="pickBtn"></button>
      <button class="btn ghost" id="clearBtn" hidden></button>
      <span id="routeInfo" class="routeinfo"></span>
    </div>
  </div>
  <div id="vetList"></div>

  <!-- ── guidance ─────────────────────────────────────────────────── -->
  <div class="card">
    <h3 data-ar="ماذا تفعل بحيواناتك عند الحريق" data-fr="Que faire de vos animaux lors d'un incendie"></h3>
    <div class="prose">
      <ul>
        <li data-ar="<b>لا تربط الماشية ولا تغلق عليها.</b> الحيوان الطليق ينجو غالبًا بغريزته؛ المربوط يحترق في مكانه. افتح الحظائر والأبواب قبل أن تغادر."
            data-fr="<b>N'attachez pas le bétail et ne l'enfermez pas.</b> Un animal libre survit souvent par instinct ; un animal attaché brûle sur place. Ouvrez les enclos avant de partir."></li>
        <li data-ar="<b>علّم حيواناتك.</b> رشّة صبغة أو شريط ملوّن على الصوف تجعل استرجاعها ممكنًا بعد أيام من التشتّت — كثير من المواشي تُفقد لأنها لا تُعرف لا لأنها ماتت."
            data-fr="<b>Marquez vos animaux.</b> Un trait de peinture ou un ruban coloré permet de les récupérer après plusieurs jours de dispersion — beaucoup de bêtes sont perdues faute d'identification, pas parce qu'elles sont mortes."></li>
        <li data-ar="<b>وجّهها إلى أرض عارية أو محروقة.</b> حقل محصود، مجرى واد، طريق واسع. النار لا تعود إلى ما احترق."
            data-fr="<b>Dirigez-les vers un sol nu ou déjà brûlé.</b> Champ moissonné, lit d'oued, large route. Le feu ne revient pas sur ce qui a brûlé."></li>
        <li data-ar="<b>لا تعد أبدًا عبر النار من أجل حيوان.</b> لا يستحق أي حيوان حياة صاحبه، والقاعدة نفسها التي تحمي البشر تحمي القطيع على المدى الطويل."
            data-fr="<b>Ne retournez jamais à travers le feu pour un animal.</b> Aucun animal ne vaut la vie de son propriétaire, et la règle qui protège les personnes protège le troupeau à long terme."></li>
        <li data-ar="<b>النحل يُنقل ليلًا.</b> عند الغروب تعود الشغّالة إلى الخلية؛ تُسدّ المداخل بقماش مبلول وتُنقل. الخلايا المتروكة تُفقد كاملة."
            data-fr="<b>Les ruches se déplacent la nuit.</b> Au crépuscule les butineuses sont rentrées ; on obture l'entrée avec un linge humide et on transporte. Une ruche abandonnée est perdue entièrement."></li>
        <li data-ar="<b>بعد النار: الماء أولًا، ثم البيطري.</b> الحيوان الناجي يعاني غالبًا من استنشاق الدخان قبل الحروق — تظهر الأعراض بعد يوم أو يومين. الحوافر والأخفاف المحروقة تحتاج علاجًا سريعًا وإلا فقد الحيوان."
            data-fr="<b>Après le feu : l'eau d'abord, puis le vétérinaire.</b> L'animal survivant souffre souvent d'inhalation de fumée avant les brûlures — les symptômes apparaissent au bout d'un ou deux jours. Sabots et coussinets brûlés exigent des soins rapides, sinon l'animal est perdu."></li>
      </ul>
    </div>
  </div>
</div>

<footer class="foot">
  <span data-ar="العيادات البيطرية: OpenStreetMap · إرشادات متوافقة مع الممارسات المتّبعة في حرائق البحر المتوسط · عند الطوارئ: الحماية المدنية 14"
        data-fr="Cliniques vétérinaires : OpenStreetMap · Conseils conformes aux pratiques méditerranéennes · Urgences : Protection civile 14"></span>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/basemap.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/routemap.js?v=10"></script>
<script>
let RM = null, ASSETS = null, GEO = null, NEEDS = null;
let picked = null;

/* Species matter because the response differs. Fodder for a flock of sheep is a
   different truck from a bale of hay for two mules, and a beehive needs moving
   rather than feeding. Lumping them all into "livestock" loses exactly the
   information a donor needs to load the right vehicle. */
const ANIMALS = [
  { k: "sheep",   icon: "🐑", ar: "أغنام وماعز", fr: "Moutons et chèvres",
    needAr: "تبن، شعير، ماء، علاج الحوافر المحروقة",
    needFr: "Foin, orge, eau, soins des sabots brûlés",
    noteAr: "أكثر الماشية تضرّرًا في الجزائر: القطعان ترعى في الغابة نفسها التي تحترق.",
    noteFr: "Le cheptel le plus touché en Algérie : les troupeaux pâturent dans la forêt qui brûle." },
  { k: "cattle",  icon: "🐄", ar: "أبقار", fr: "Bovins",
    needAr: "علف مركّز، تبن، ماء بكميات كبيرة",
    needFr: "Aliment concentré, foin, eau en grande quantité",
    noteAr: "البقرة تشرب حتى 100 لتر يوميًا — نقص الماء يقتل قبل الجوع.",
    noteFr: "Une vache boit jusqu'à 100 litres par jour — le manque d'eau tue avant la faim." },
  { k: "horses",  icon: "🐴", ar: "خيول وبغال وحمير", fr: "Chevaux, mulets, ânes",
    needAr: "شعير، تبن، ضمادات للحروق",
    needFr: "Orge, foin, pansements pour brûlures",
    noteAr: "وسيلة النقل الوحيدة في كثير من المشاتي الجبلية — فقدانها يعزل العائلة.",
    noteFr: "Seul moyen de transport dans beaucoup de hameaux de montagne — les perdre isole la famille." },
  { k: "poultry", icon: "🐔", ar: "دواجن", fr: "Volaille",
    needAr: "حبوب، ماء، أقفاص نقل",
    needFr: "Grains, eau, cages de transport",
    noteAr: "تموت بسرعة من الدخان في المباني المغلقة.",
    noteFr: "Meurt vite de la fumée dans les bâtiments fermés." },
  { k: "bees",    icon: "🐝", ar: "نحل", fr: "Abeilles",
    needAr: "خلايا بديلة، تغذية سكرية، نقل ليلي",
    needFr: "Ruches de remplacement, nourrissement, transport de nuit",
    noteAr: "عسل جيجل وبجاية مورد رئيسي — الخلية المحترقة تعني موسمًا كاملًا.",
    noteFr: "Le miel de Jijel et Béjaïa est une ressource clé — une ruche brûlée, c'est une saison entière." },
  { k: "pets",    icon: "🐕", ar: "قطط وكلاب", fr: "Chats et chiens",
    needAr: "طعام، ماء، علاج حروق ودخان، مأوى مؤقت",
    needFr: "Nourriture, eau, soins brûlures et fumée, abri temporaire",
    noteAr: "تُترك غالبًا أثناء الإجلاء وتعود إلى المنزل المحترق.",
    noteFr: "Souvent laissés lors de l'évacuation, ils reviennent vers la maison brûlée." },
];

const api = (p, o) => fetch("/api/v1" + p, o).then((r) => (r.ok ? r.json() : null));

const wname = (code) => {
  const g = GEO && GEO.features.find((x) => x.properties.code === code);
  return g ? wilayaName(g.properties) : "—";
};

function renderAnimals() {
  document.getElementById("animalGrid").innerHTML = ANIMALS.map((a) =>
    '<button class="animal' + (picked === a.k ? " on" : "") + '" data-k="' + a.k + '">' +
    '<span class="an-ic">' + a.icon + "</span>" +
    "<b>" + (isAr() ? a.ar : a.fr) + "</b></button>").join("");
  document.querySelectorAll(".animal").forEach((b) =>
    b.addEventListener("click", () => { picked = b.dataset.k; renderAnimals(); renderDetail(); }));
  renderDetail();
}

function renderDetail() {
  const box = document.getElementById("animalDetail");
  const a = ANIMALS.find((x) => x.k === picked);
  if (!a) { box.innerHTML = ""; return; }
  box.innerHTML =
    '<div class="an-detail">' +
      "<b>" + a.icon + " " + (isAr() ? a.ar : a.fr) + "</b>" +
      "<p>" + (isAr() ? a.noteAr : a.noteFr) + "</p>" +
      '<div class="an-needs"><span>' + (isAr() ? "يحتاج عادةً:" : "Besoins courants :") + "</span> " +
        (isAr() ? a.needAr : a.needFr) + "</div>" +
    "</div>";
  // Pre-fill the request so the person does not start from a blank field.
  const item = document.getElementById("fItem");
  if (!item.value) item.value = (isAr() ? a.ar : a.fr) + " — ";
}

function renderStats() {
  const L = T();
  const list = (NEEDS && NEEDS.needs) || [];
  const open = list.filter((x) => x.status === "open").length;
  const crit = list.filter((x) => x.urgency === "critical" && x.status === "open").length;
  const vets = ((ASSETS && ASSETS.assets.vet) || []).length;
  document.getElementById("stats").innerHTML =
    '<div class="stat ' + (crit ? "danger" : "") + '"><b>' + n(crit) + "</b><span>" +
      (isAr() ? "طلب حرج" : "demandes critiques") + "</span></div>" +
    '<div class="stat warn"><b>' + n(open) + "</b><span>" +
      (isAr() ? "طلب مفتوح للحيوانات" : "demandes ouvertes") + "</span></div>" +
    '<div class="stat"><b>' + n(vets) + "</b><span>" +
      (isAr() ? "عيادة بيطرية على الخريطة" : "cliniques vétérinaires") + "</span></div>" +
    '<div class="stat good"><b>' + n(list.filter((x) => x.status === "delivered").length) +
      "</b><span>" + (isAr() ? "سُلِّمت" : "livrées") + "</span></div>";
}

function renderNeeds() {
  const L = T();
  const list = (NEEDS && NEEDS.needs) || [];
  const box = document.getElementById("needs");
  if (!list.length) {
    box.innerHTML = '<p class="none">' +
      (isAr() ? "لا طلبات مسجّلة بعد." : "Aucune demande enregistrée.") + "</p>";
    return;
  }
  box.innerHTML = '<div class="needlist">' + list.map((x) => {
    const cls = { critical: "u-crit", urgent: "u-urg" }[x.urgency] || "u-norm";
    const where = [x.place, x.commune, wname(x.wilaya)].filter(Boolean).join("، ");
    return '<div class="need ' + cls + '">' +
      '<div class="need-h"><b>' + (x.category === "animal_care" ? "🐕 " : "🐑 ") + x.item +
        (x.quantity ? ' <span class="qty">' + x.quantity + "</span>" : "") + "</b></div>" +
      '<div class="need-w">' + (where || "—") + "</div>" +
      (x.notes ? '<div class="need-n">' + x.notes + "</div>" : "") +
      '<div class="need-f">' +
        (x.phone ? '<a class="need-tel" href="tel:' + x.phone + '">☎ ' + x.phone + "</a>" : "") +
        '<span class="need-st">' + (isAr() ? "الحالة: " : "État : ") + x.status + "</span>" +
      "</div></div>";
  }).join("") + "</div>";
}

function vetGeoJSON() {
  const vets = (ASSETS && ASSETS.assets.vet) || [];
  return { type: "FeatureCollection", features: vets.filter((v) => v.lat).map((v) => ({
    type: "Feature", geometry: { type: "Point", coordinates: [v.lon, v.lat] },
    properties: { name: v.name || "", wilaya: v.wilaya || "" } })) };
}

function addVetLayer() {
  RM.map.addSource("vets", { type: "geojson", data: vetGeoJSON() });
  RM.map.addLayer({ id: "vets", type: "circle", source: "vets",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 5, 4, 12, 10],
      "circle-color": "#7B61FF", "circle-stroke-width": 2,
      "circle-stroke-color": "#ffffff", "circle-opacity": 0.92,
    } });
  RM.map.on("mouseenter", "vets", () => { RM.map.getCanvas().style.cursor = "pointer"; });
  RM.map.on("mouseleave", "vets", () => { RM.map.getCanvas().style.cursor = ""; });
  RM.map.on("click", "vets", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ offset: 12 }).setLngLat(e.lngLat)
      .setHTML('<div class="pop-kind"><i style="background:#7B61FF"></i>' +
        (isAr() ? "طبيب بيطري" : "Vétérinaire") + "</div>" +
        '<div class="pop-name">' + (p.name || (isAr() ? "بدون اسم" : "Sans nom")) + "</div>")
      .addTo(RM.map);
  });
}

function refreshVets() {
  if (!RM || !RM.map) return;
  const src = RM.map.getSource("vets");
  if (src) { src.setData(vetGeoJSON()); return; }
  try { addVetLayer(); } catch (e) { /* style settling; next render retries */ }
}

function renderVetList() {
  const L = T();
  const box = document.getElementById("vetList");
  if (!RM || !RM.here) { box.innerHTML = ""; return; }
  const vets = ((ASSETS && ASSETS.assets.vet) || [])
    .filter((v) => v.lat)
    .map((v) => ({ ...v, km: kmBetween(RM.here.lat, RM.here.lon, v.lat, v.lon) }))
    .sort((a, b) => a.km - b.km).slice(0, 4);
  if (!vets.length) { box.innerHTML = ""; return; }

  box.innerHTML = '<div class="card"><h3>' +
    (isAr() ? "أقرب العيادات إليك" : "Cliniques les plus proches") + '</h3><div class="needlist">' +
    vets.map((v) => '<div class="need u-norm">' +
      '<div class="need-h"><b>🐾 ' + (v.name || L.unnamed) + "</b></div>" +
      '<div class="need-w">' + wname(v.wilaya) + " · " + n(v.km.toFixed(1)) + " " + L.km + " " + L.direct + "</div>" +
      '<div class="need-f"><span class="need-st"></span>' +
        '<button class="btn ghost route" data-lat="' + v.lat + '" data-lon="' + v.lon +
        '" data-name="' + (v.name || "").replace(/"/g, "&quot;") + '">' + L.showRoute + "</button>" +
      "</div></div>").join("") + "</div></div>";

  document.querySelectorAll(".route").forEach((b) =>
    b.addEventListener("click", async () => {
      const res = await RM.route({ lat: +b.dataset.lat, lon: +b.dataset.lon,
                                   name: b.dataset.name, icon: "🐾" },
                                 { min: L.min, km: L.km, by: L.driveTime });
      document.getElementById("clearBtn").hidden = !!res.error;
      if (res.error === "no-route") document.getElementById("routeInfo").textContent = L.noRoute;
    }));
}

function fillWilayas() {
  if (!GEO) return;
  const f = document.getElementById("fWilaya");
  const cur = f.value;
  f.innerHTML = '<option value="">—</option>' + GEO.features.slice()
    .sort((a, b) => wilayaName(a.properties).localeCompare(wilayaName(b.properties)))
    .map((g) => '<option value="' + g.properties.code + '">' +
      wilayaName(g.properties) + "</option>").join("");
  f.value = cur;
}

async function loadNeeds() {
  const [feed, care] = await Promise.all([
    api("/needs?category=animal_feed"), api("/needs?category=animal_care"),
  ]);
  const merged = [].concat((feed && feed.needs) || [], (care && care.needs) || []);
  NEEDS = { needs: merged };
  renderStats();
  renderNeeds();
}

document.getElementById("needForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("addMsg");
  try {
    const r = await api("/needs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        item: document.getElementById("fItem").value,
        category: document.getElementById("fCat").value,
        quantity: document.getElementById("fQty").value || null,
        wilaya: document.getElementById("fWilaya").value || null,
        commune: document.getElementById("fPlace").value || null,
        phone: document.getElementById("fPhone").value || null,
        notes: document.getElementById("fNotes").value || null,
        urgency: "urgent",
      }),
    });
    if (!r) throw new Error("no api");
    msg.style.color = "var(--hope)";
    msg.textContent = isAr() ? "تم التسجيل." : "Enregistré.";
    e.target.reset();
    await loadNeeds();
  } catch (err) {
    msg.style.color = "#B01F1F";
    msg.textContent = T().needServer;
  }
});

function labels() {
  const L = T();
  document.getElementById("geoBtn").textContent = L.locateMe;
  document.getElementById("pickBtn").textContent = L.pickOnMap;
  document.getElementById("clearBtn").textContent = L.clearRoute;
  if (RM) RM.hint(RM.here ? L.chooseDest : L.locateFirst);
  document.querySelectorAll("#fCat option").forEach((o) => {
    o.textContent = isAr() ? o.dataset.ar : o.dataset.fr;
  });
}

function redraw() {
  labels(); fillWilayas(); renderAnimals();
  renderStats(); renderNeeds(); refreshVets(); renderVetList();
}

(async function () {
  initPage({ redraw });

  RM = createRouteMap({
    container: "map", hintId: "mapHint", infoId: "routeInfo",
    center: [5.9, 36.6], zoom: 7,
    onLocate: () => { renderVetList(); labels(); },
  });
  document.getElementById("geoBtn").addEventListener("click", () =>
    RM.locateMe(() => RM.hint(T().locationDenied)));
  document.getElementById("pickBtn").addEventListener("click", () =>
    RM.pick(T().pickHintMap));
  document.getElementById("clearBtn").addEventListener("click", () => {
    RM.clearRoute(); document.getElementById("clearBtn").hidden = true;
  });

  const style = await basemapStyle();
  try {
    if (maplibregl.getRTLTextPluginStatus() === "unavailable") {
      await maplibregl.setRTLTextPlugin(
        "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js", false);
    }
  } catch (e) { /* labels degrade */ }

  [ASSETS, GEO] = await Promise.all([loadAssets(), loadWilayaGeo()]);
  await RM.init(style);
  redraw();
  await loadNeeds();
  RM.whenReady(() => { if (!RM.map.getSource("vets")) addVetLayer(); })
    .catch((e) => console.warn("vet layer:", e.message));
})();
</script>
