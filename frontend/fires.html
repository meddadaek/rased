<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحرائق النشطة · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css?v=11" rel="stylesheet">
<link href="css/pages.css?v=11" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="page-head">
    <h1 data-i18n="firesPage">الحرائق النشطة</h1>
    <p data-i18n="firesLede"></p>
  </div>
  <div id="notice"></div>
  <div id="stats" class="grid4" style="margin-bottom:12px"></div>
  <div id="windowBar" class="windowbar"></div>
  <div id="charts"></div>
  <div id="content"><div class="loading">…</div></div>
</div>

<footer class="foot">
  <span data-ar="البؤر: NASA FIRMS · السكان والمرافق: OpenStreetMap · المسارات: OSRM · الطقس: Open-Meteo"
        data-fr="Foyers : NASA FIRMS · Population et établissements : OpenStreetMap · Itinéraires : OSRM · Météo : Open-Meteo"></span>
</footer>

<script src="js/config.js?v=11"></script>
<script src="js/i18n.js?v=11"></script>
<script src="js/common.js?v=11"></script>
<script src="js/charts.js?v=11"></script>
<script>
let FIRES = null, EXPO = null, GEO = null;
let sortKey = "prio", sortDir = -1;

/* Hours since a satellite last saw the fire. 6 is roughly two VIIRS passes —
   long enough not to miss a fire between overpasses, short enough that
   "still burning" stays an honest claim. */
let WINDOW_H = 6;
const WINDOWS = [6, 12, 24, 48];

/* Ranking by exposed population alone turned out to be just as wrong as ranking
   by fire size. With real data the top of the table filled with 1-14 MW heat
   blips on the edge of Algiers — trivial anomalies that happen to sit near half
   a million people — while Jijel's 8000 MW fires sat far below.
   
   Threat needs both terms. sqrt(FRP) because radiative power spans four orders
   of magnitude and a fire twice as powerful is not twice as dangerous;
   log10(population) because the step from 100 to 1000 people at risk matters far
   more than 100,000 to 101,000. */
function priority(frp, pop) {
  return Math.sqrt(Math.max(frp, 0)) * Math.log10(1 + Math.max(pop, 0));
}
const COLS = [
  { key: "id",    label: "colFire",       sortable: false },
  { key: "prio",  label: "colPriority",   sortable: true,  num: true },
  { key: "wil",   label: "colWilaya",     sortable: true  },
  { key: "pop5",  label: "colPeople5",    sortable: true,  num: true },
  { key: "pop10", label: "colPeople10",   sortable: true,  num: true },
  { key: "frp",   label: "colPower",      sortable: true,  num: true },
  { key: "det",   label: "colDetections", sortable: true,  num: true },
  { key: "stn",   label: "colStation",    sortable: false },
  { key: "drive", label: "colDrive",      sortable: true,  num: true },
  { key: "grow",  label: "colStatus",     sortable: true  },
];

function rows() {
  const byId = {};
  (EXPO ? EXPO.fires : []).forEach((e) => { byId[e.id] = e; });

  // Two filters, both load-bearing:
  //
  //   category  gas flares in the Sahara are real heat but not wildfires, and
  //             would otherwise top a table meant to rank emergencies.
  //   active    a satellite has seen it within the selected window. The full
  //             48h feed contains hundreds of fires that are already out; a page
  //             headed "burning now" must not count them. Defaults to 6h.
  return FIRES.fires
    .filter((f) => f.category !== "industrial")
    .filter((f) => WINDOW_H >= 48 ? true : f.last_seen_h <= WINDOW_H)
    .map((f) => {
    const e = byId[f.id];
    const meta = GEO.features.find((g) => g.properties.code === f.wilaya);
    const st = e && e.station;
    return {
      id: f.id,
      wilaya: f.wilaya,
      wil: meta ? wilayaName(meta.properties) : "—",
      pop5: e ? e.rings.r5.pop : 0,
      pop10: e ? e.rings.r10.pop : 0,
      frp: f.frp_total || 0,
      det: f.detections || 0,
      stn: st ? (st.name || "—") : "—",
      stnKm: st ? st.km_direct : null,
      drive: st && st.route ? st.route.min : null,
      driveKm: st && st.route ? st.route.km : null,
      grow: f.growing ? 1 : 0,
      lat: f.lat, lon: f.lon,
      places5: e ? e.rings.r5.places : 0,
      nearest: e ? e.rings.r5.nearest : [],
      prio: priority(f.frp_total || 0, e ? e.rings.r5.pop : 0),
      isNew: !!f.is_new,
      burningH: f.burning_hours,
    };
  });
}

/* Two questions a coordinator asks first: where is it concentrated, and how
   many of these are actually threatening people. */
function renderCharts(rows) {
  const L = T();
  const box = document.getElementById("charts");
  if (!box) return;
  if (!rows.length) { box.innerHTML = ""; return; }

  const byWilaya = {};
  for (const r of rows) {
    const k = r.wil || "—";
    byWilaya[k] = byWilaya[k] || { fires: 0, pop: 0 };
    byWilaya[k].fires += 1;
    byWilaya[k].pop += r.pop5;
  }
  const ranked = Object.entries(byWilaya)
    .map(([k, v]) => ({ label: k, value: v.pop, fires: v.fires }))
    .sort((a, b) => b.value - a.value);

  // People near a fire, by wilaya — the number that decides where aid goes.
  const popChart = rowChart({
    title: isAr() ? "السكان القريبون من النار حسب الولاية" : "Population proche du feu par wilaya",
    limit: 8,
    data: ranked.map((r) => ({
      label: r.label + " (" + n(r.fires) + ")",
      value: r.value,
      display: nInt(r.value),
    })),
  });

  // How the burning fires split by exposure, so "40 fires" does not read as
  // forty equal emergencies.
  const bands = [
    { label: isAr() ? "لا سكان قريبين" : "aucun habitant", test: (r) => r.pop5 === 0, color: "#9AA8A2" },
    { label: isAr() ? "أقل من 1000" : "< 1 000", test: (r) => r.pop5 > 0 && r.pop5 < 1000, color: "#8FBF3F" },
    { label: "1 000 – 10 000", test: (r) => r.pop5 >= 1000 && r.pop5 < 10000, color: "#F7D01E" },
    { label: "10 000 – 50 000", test: (r) => r.pop5 >= 10000 && r.pop5 < 50000, color: "#EF7A1A" },
    { label: isAr() ? "أكثر من 50 ألف" : "> 50 000", test: (r) => r.pop5 >= 50000, color: "#C01818" },
  ].map((b) => ({ label: b.label, color: b.color, value: rows.filter(b.test).length }));

  box.innerHTML =
    '<div class="grid2" style="margin-bottom:18px">' +
      '<div class="card" style="margin:0"><h3>' +
        (isAr() ? "أين يتركّز الخطر" : "Où le danger se concentre") + "</h3>" + popChart +
        '<p class="chart-note">' + (isAr()
          ? "الرقم بين قوسين هو عدد البؤر في الولاية. الترتيب حسب السكان لا حسب عدد الحرائق."
          : "Le nombre entre parenthèses est le nombre de foyers. Classement par population, pas par nombre de feux.") +
        "</p></div>" +
      '<div class="card" style="margin:0"><h3>' +
        (isAr() ? "توزيع البؤر حسب السكان القريبين" : "Répartition des foyers par population proche") + "</h3>" +
        stackBar({ title: "exposure bands", data: bands }) +
        '<p class="chart-note">' + (isAr()
          ? "معظم البؤر تشتعل بعيدًا عن السكان — القليل منها هو الطارئ الحقيقي."
          : "La plupart des foyers brûlent loin des habitations — seuls quelques-uns sont la vraie urgence.") +
        "</p></div>" +
    "</div>";
}

function render() {
  const L = T();
  document.title = L.firesPage + " · " + L.brand;

  document.getElementById("notice").innerHTML = simulatedNotice(FIRES.source);

  const rs = rows();
  const growing = rs.filter((r) => r.grow).length;
  const pop5 = rs.reduce((a, r) => a + r.pop5, 0);
  const pop10 = rs.reduce((a, r) => a + r.pop10, 0);

  const allVeg = FIRES.fires.filter((f) => f.category !== "industrial").length;
  const brandNew = rs.filter((r) => r.isNew).length;

  document.getElementById("stats").innerHTML =
    '<div class="stat ' + (rs.length ? "danger" : "good") + '"><b>' + n(rs.length) + "</b>" +
      "<span>" + L.burningNow + "<br>" + L.seenWithin.replace("{h}", WINDOW_H) + "</span></div>" +
    '<div class="stat ' + (brandNew ? "warn" : "") + '"><b>' + n(brandNew) + "</b>" +
      "<span>" + L.newlyStarted + "</span></div>" +
    '<div class="stat danger"><b>' + nInt(pop5) + "</b><span>" + L.people + " · " + L.within5 + "</span></div>" +
    '<div class="stat"><b>' + nInt(pop10) + "</b><span>" + L.people + " · " + L.within10 + "</span></div>";

  document.getElementById("windowBar").innerHTML =
    '<span class="wl">' + L.windowLabel + "</span>" +
    WINDOWS.map((h) =>
      '<button class="wchip' + (h === WINDOW_H ? " on" : "") + '" data-h="' + h + '">' +
      L.hoursN.replace("{h}", h) + "</button>").join("") +
    '<span class="wnote">' + L.windowNote.replace("{n}", allVeg) + "</span>";

  document.querySelectorAll(".wchip").forEach((b) =>
    b.addEventListener("click", () => { WINDOW_H = +b.dataset.h; render(); }));

  renderCharts(rs);

  if (!rs.length) {
    document.getElementById("content").innerHTML =
      '<div class="card"><p class="none">' + L.noFiresNow + "</p></div>";
    return;
  }

  rs.sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    if (typeof va === "string") return sortDir * va.localeCompare(vb);
    return sortDir * ((va === null ? -1 : va) - (vb === null ? -1 : vb));
  });

  const head = COLS.map((c) =>
    "<th" + (c.sortable ? ' class="sortable" data-k="' + c.key + '"' : "") + ">" +
    L[c.label] +
    (c.sortable && sortKey === c.key ? ' <span class="arrow">' + (sortDir < 0 ? "▼" : "▲") + "</span>" : "") +
    "</th>").join("");

  const body = rs.map((r) => {
    const near = r.nearest.slice(0, 2).map((p) => p.name).filter(Boolean).join("، ");
    return "<tr>" +
      "<td><b>" + r.id + "</b>" + (near ? '<br><span style="font-size:10px;color:var(--txt-faint)">' + near + "</span>" : "") + "</td>" +
      '<td class="num"><b style="color:var(--ember)">' + n(Math.round(r.prio)) + "</b></td>" +
      '<td><a href="wilaya.html?code=' + (r.wilaya || "") + '">' + r.wil + "</a></td>" +
      '<td class="num"><b>' + nInt(r.pop5) + "</b>" +
        '<br><span style="font-size:10px;color:var(--txt-faint)">' + n(r.places5) + " " + L.villages + "</span></td>" +
      '<td class="num">' + nInt(r.pop10) + "</td>" +
      '<td class="num">' + n(Math.round(r.frp)) + " MW</td>" +
      '<td class="num">' + n(r.det) + "</td>" +
      "<td>" + r.stn + (r.stnKm !== null ? '<br><span style="font-size:10px;color:var(--txt-faint)">' + n(r.stnKm) + " " + L.km + " " + L.direct + "</span>" : "") + "</td>" +
      '<td class="num">' + (r.drive !== null
        ? "<b>" + n(r.drive) + " " + L.min + "</b><br><span style=\"font-size:10px;color:var(--txt-faint)\">" + n(r.driveKm) + " " + L.km + "</span>"
        : "—") + "</td>" +
      "<td>" + (r.isNew ? '<span class="pill grow">' + L.newBadge + "</span> " : "") +
        (r.grow ? '<span class="pill grow">' + L.growing + "</span>"
                : '<span class="pill calm">' + (r.burningH != null
                    ? L.burningFor.replace("{h}", n(Math.round(r.burningH))) : "—") + "</span>") +
      "</td>" +
      "</tr>";
  }).join("");

  document.getElementById("content").innerHTML =
    '<div class="tablewrap"><table class="data"><thead><tr>' + head +
    "</tr></thead><tbody>" + body + "</tbody></table></div>";

  document.querySelectorAll("th.sortable").forEach((th) =>
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = -1; }
      render();
    }));
}

(async function () {
  initPage({ redraw: render });
  try {
    [FIRES, GEO] = await Promise.all([loadFires(), loadWilayaGeo()]);
    try { EXPO = await loadExposure(); } catch (e) { EXPO = null; }
    render();
  } catch (err) {
    document.getElementById("content").innerHTML =
      '<div class="notice danger">' + err.message + "</div>";
  }
})();
</script>
</body>
</html>
