<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ولاية · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="notice" id="predBanner"></div>
  <div id="content"><div class="loading">…</div></div>
</div>

<footer class="foot">
  <span data-ar="الطقس: Open-Meteo · المرافق: OpenStreetMap · البؤر: NASA FIRMS"
        data-fr="Météo : Open-Meteo · Établissements : OpenStreetMap · Foyers : NASA FIRMS"></span>
</footer>

<script src="js/i18n.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/charts.js?v=10"></script>
<script>
const CODE = new URLSearchParams(location.search).get("code") || "18";
let RISK = null, GEO = null, FIRES = null, EXPO = null, ASSETS = null;

const DOW = (iso) => new Date(iso + "T12:00:00").getDay();

function render() {
  const PB = document.getElementById('predBanner');
  if (PB) PB.innerHTML = '<b>' + T().predictedTitle + '</b> ' + T().predictedBody;
  const L = T();
  const feat = GEO.features.find((g) => g.properties.code === CODE);
  if (!feat) {
    document.getElementById("content").innerHTML =
      '<div class="notice danger">unknown wilaya code: ' + CODE + "</div>";
    return;
  }
  const p = feat.properties;
  const w = RISK.wilayas[CODE];
  const today = w.days[0];
  document.title = wilayaName(p) + " · " + L.brand;

  let html =
    '<div class="page-head">' +
      '<a href="wilayas.html" style="font-size:11.5px;color:var(--txt-dim);text-decoration:none">← ' + L.backList + "</a>" +
      "<h1 style=\"margin-top:8px\">" + wilayaName(p) + "</h1>" +
      "<p>" + n(p.code) + " · " + (isAr() ? p.name_fr : p.name_ar) +
        " · " + L.fuel[p.fuel] + "</p>" +
    "</div>";

  html += simulatedNotice(FIRES && FIRES.source);

  // today
  html +=
    '<div class="grid4" style="margin-bottom:16px">' +
      '<div class="stat"><b style="color:' + CLASS_COLORS[today.class] + '">' +
        n(today.fwi.toFixed(1)) + "</b><span>" + L.todayRisk + " · " + L.cls[today.class] + "</span></div>" +
      '<div class="stat"><b>' + n(Math.round(today.weather.temp)) + "°</b><span>" + L.temp + "</span></div>" +
      '<div class="stat"><b>' + n(Math.round(today.weather.rh)) + "%</b><span>" + L.rh + "</span></div>" +
      '<div class="stat"><b>' + n(Math.round(today.weather.wind)) + "</b><span>" + L.wind + " km/h</span></div>" +
    "</div>";

  // 7-day forecast, as a chart. Each bar is coloured by its own danger class,
  // so the shape of the week and its severity read in one glance.
  html += '<div class="card"><h3>' + L.forecast7 + "</h3>" +
    barChart({
      title: L.forecast7,
      height: 200,
      data: w.days.map((d) => ({
        label: L.dow[DOW(d.date)],
        sub: n(d.date.slice(8)),
        value: d.fwi,
        display: n(d.fwi.toFixed(0)),
        color: CLASS_COLORS[d.class],
      })),
    }) +
    '<p class="chart-note">' +
      (isAr() ? "العمود ملوّن بدرجة الخطر لذلك اليوم. القيم مُعدَّلة حسب الغطاء النباتي."
              : "Chaque barre porte la couleur de son niveau de danger. Valeurs pondérées par la végétation.") +
    "</p></div>";

  // Index components — "why is it high" matters as much as "it is high".
  const COMP = {
    FFMC: isAr() ? "رطوبة الوقود الدقيق" : "Combustibles fins",
    DMC:  isAr() ? "رطوبة الطبقة المتوسطة" : "Couche intermédiaire",
    DC:   isAr() ? "الجفاف العميق" : "Sécheresse profonde",
    ISI:  isAr() ? "سرعة الانتشار" : "Vitesse de propagation",
    BUI:  isAr() ? "الوقود المتاح" : "Combustible disponible",
  };
  html += '<div class="card"><h3>' + L.components + "</h3>" +
    rowChart({
      title: L.components,
      data: [["FFMC", today.ffmc, 101], ["DMC", today.dmc, 150], ["DC", today.dc, 900],
             ["ISI", today.isi, 50], ["BUI", today.bui, 200]].map(([k, v, max]) => ({
        label: k + " · " + COMP[k],
        value: Math.min(100, (v / max) * 100),
        display: n(v.toFixed(1)),
        color: CLASS_COLORS[today.class],
      })),
    }) +
    '<p class="chart-note">' +
      (isAr() ? "الأشرطة نسبة من المدى الكامل لكل مؤشر. الجفاف العميق (DC) يتراكم على أسابيع، والبقية تتغيّر يوميًا."
              : "Barres en proportion de l'échelle de chaque code. La sécheresse profonde (DC) s'accumule sur des semaines ; les autres varient au jour le jour.") +
    "</p></div>";

  // active fires here
  const mine = FIRES
    ? FIRES.fires.filter((f) => f.wilaya === CODE && f.category !== "industrial")
    : [];
  const expoById = {};
  if (EXPO) EXPO.fires.forEach((e) => { expoById[e.id] = e; });

  html += '<div class="card"><h3>' + L.firesHere + "</h3>";
  if (!mine.length) {
    html += '<p class="none">' + L.noFires + "</p>";
  } else {
    html += '<div class="grid2">' + mine.map((f) => {
      const e = expoById[f.id];
      const st = e && e.station;
      const near = e ? e.rings.r5.nearest.slice(0, 3).map((x) =>
        x.name + " (" + n(x.km.toFixed(1)) + " " + L.km + ")").join("، ") : "";
      return '<div class="stat" style="padding:15px 16px">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">' +
          "<b style=\"font-size:17px\">" + f.id + "</b>" +
          '<span style="color:var(--ember);font-weight:700">' + n(Math.round(f.frp_total)) + " MW</span>" +
        "</div>" +
        (e ? '<span style="margin-top:8px">' + nInt(e.rings.r5.pop) + " " + L.people + " · " + L.within5 + "</span>" : "") +
        (near ? '<span style="margin-top:6px;color:var(--txt-dim)">' + near + "</span>" : "") +
        (st ? '<span style="margin-top:8px;color:var(--txt-dim)">🚒 ' + (st.name || "") +
              (st.route ? " — <b style=\"color:var(--ember)\">" + n(st.route.min) + " " + L.min + "</b> · " + n(st.route.km) + " " + L.km : "") +
              "</span>" : "") +
        (f.growing ? '<span style="margin-top:8px"><span class="pill grow">' + L.growing + "</span></span>" : "") +
      "</div>";
    }).join("") + "</div>";
  }
  html += "</div>";

  // responders present in this wilaya
  if (ASSETS) {
    const a = ASSETS.assets;
    const count = (k) => (a[k] || []).filter((x) => x.wilaya === CODE).length;
    const list = (k, limit) => (a[k] || []).filter((x) => x.wilaya === CODE && x.name)
      .slice(0, limit).map((x) => x.name);

    html += '<div class="card"><h3>' + L.respondersHere + "</h3>" +
      '<div class="grid4" style="margin-bottom:14px">' +
        '<div class="stat"><b>' + n(count("fire_station")) + "</b><span>" + L.lyr.fire_station + "</span></div>" +
        '<div class="stat"><b>' + n(count("hospital")) + "</b><span>" + L.lyr.hospital + "</span></div>" +
        '<div class="stat"><b>' + n(count("aid")) + "</b><span>" + L.aidOrg + "</span></div>" +
        '<div class="stat"><b>' + n(count("water")) + "</b><span>" + L.lyr.water + "</span></div>" +
      "</div>";

    const stations = list("fire_station", 8);
    if (stations.length) {
      html += '<div class="prose"><ul>' +
        stations.map((s) => "<li>" + s + "</li>").join("") + "</ul></div>";
    }
    html += "</div>";
  }

  document.getElementById("content").innerHTML = html;
}

(async function () {
  initPage({ redraw: render });
  try {
    [RISK, GEO] = await Promise.all([loadRisk(), loadWilayaGeo()]);
    const rest = await Promise.allSettled([loadFires(), loadExposure(), loadAssets()]);
    FIRES = rest[0].status === "fulfilled" ? rest[0].value : null;
    EXPO = rest[1].status === "fulfilled" ? rest[1].value : null;
    ASSETS = rest[2].status === "fulfilled" ? rest[2].value : null;
    render();
  } catch (err) {
    document.getElementById("content").innerHTML =
      '<div class="notice danger">' + err.message + "</div>";
  }
})();
</script>
</body>
</html>
