<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بلّغ عن حريق · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap wrap-narrow">
  <div class="page-head">
    <h1 data-i18n="reportPage">بلّغ عن حريق</h1>
    <p data-i18n="reportLede"></p>
  </div>

  <div class="notice danger">
    <b data-i18n="callFirst">اتصل بـ 14 أولًا</b> —
    <span data-ar="الحماية المدنية 14 أو 1021 · الدرك 1055. هذا الموقع لا يُرسل نداء نجدة."
          data-fr="Protection civile 14 ou 1021 · Gendarmerie 1055. Ce site n'envoie pas d'appel de secours."></span>
  </div>

  <div class="card">
    <h3 data-i18n="pickLocation">حدّد الموقع على الخريطة</h3>
    <p class="hint" style="font-size:11.5px;color:var(--txt-faint);margin-bottom:11px" data-i18n="pickHint"></p>
    <div class="minimap" id="map">
      <div class="minimap-hint" id="mapHint"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
      <button class="btn ghost" id="geoBtn" data-i18n="useMyLocation">استعمل موقعي</button>
      <span id="coords" style="font-size:11.5px;color:var(--txt-faint);align-self:center"></span>
    </div>
  </div>

  <div id="nearby"></div>

  <form class="card" id="form">
    <h3 data-i18n="kind">نوع البلاغ</h3>
    <div class="choices" id="kinds" style="margin-bottom:16px"></div>

    <div class="field">
      <label data-i18n="noteLabel">وصف مختصر</label>
      <textarea id="note" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label data-i18n="communeLabel">البلدية</label>
      <input id="commune" maxlength="120">
    </div>
    <div class="field">
      <label data-i18n="contactLabel">هاتف للتواصل (اختياري)</label>
      <input id="contact" maxlength="120" inputmode="tel">
      <div class="hint" data-i18n="contactHint"></div>
    </div>

    <button class="btn" id="submit" type="submit" disabled data-i18n="send">أرسل البلاغ</button>
    <div id="result" style="margin-top:14px"></div>
  </form>
</div>

<footer class="foot">
  <span data-ar="البلاغات تُخزَّن محليًا وتُقارن آليًا برصد الأقمار الاصطناعية. لا يُنشر رقم هاتفك أبدًا."
        data-fr="Les signalements sont stockés localement et recoupés automatiquement avec les détections satellite. Votre numéro n'est jamais publié."></span>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/basemap.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script>
let map = null, marker = null, ASSETS = null;
let picked = null, kind = "smoke";

const KINDS = [
  { v: "smoke", i: "🌫️", k: "kindSmoke" },
  { v: "fire",  i: "🔥", k: "kindFire" },
  { v: "help",  i: "🆘", k: "kindHelp" },
  { v: "road",  i: "🚧", k: "kindRoad" },
];

const R = 6371;
function haversine(a, b, c, d) {
  const p = Math.PI / 180;
  const x = Math.sin((c - a) * p / 2) ** 2 +
            Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function nearestOf(kindKey, lat, lon, limit) {
  const items = (ASSETS && ASSETS.assets[kindKey]) || [];
  return items
    .map((x) => ({ ...x, km: haversine(lat, lon, x.lat, x.lon) }))
    .sort((a, b) => a.km - b.km)
    .slice(0, limit || 1);
}

/* Real road geometry, not a straight line. In mountainous Kabylie the crow-flies
   distance to a hospital is routinely half the real driving distance, and showing
   the short number to someone deciding whether to move an injured person would be
   actively dangerous. */
async function route(fromLat, fromLon, toLat, toLon) {
  const url = "https://router.project-osrm.org/route/v1/driving/" +
    fromLon + "," + fromLat + ";" + toLon + "," + toLat +
    "?overview=full&geometries=geojson";
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (d.code !== "Ok" || !d.routes || !d.routes.length) return null;
    return {
      km: (d.routes[0].distance / 1000).toFixed(1),
      min: Math.round(d.routes[0].duration / 60),
      geometry: d.routes[0].geometry,
    };
  } catch (e) {
    return null;
  }
}

function drawRoute(geometry) {
  const data = { type: "Feature", geometry, properties: {} };
  if (map.getSource("route")) {
    map.getSource("route").setData(data);
    return;
  }
  map.addSource("route", { type: "geojson", data });
  map.addLayer({
    id: "route-glow", type: "line", source: "route",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#ff6b35", "line-width": 9, "line-opacity": 0.22, "line-blur": 3 },
  });
  map.addLayer({
    id: "route-line", type: "line", source: "route",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#ff9668", "line-width": 3 },
  });
}

async function showNearby(lat, lon) {
  const L = T();
  const box = document.getElementById("nearby");
  if (!ASSETS) { box.innerHTML = ""; return; }

  const groups = [
    { key: "hospital",     icon: "🏥", label: L.hospitalKind },
    { key: "fire_station", icon: "🚒", label: L.stationKind },
    { key: "aid",          icon: "🤝", label: L.aidOrg },
  ];

  box.innerHTML = '<div class="card"><h3>' + L.nearbyHelp + "</h3><div id=\"nbList\"></div></div>";
  const list = document.getElementById("nbList");

  for (const g of groups) {
    const hit = nearestOf(g.key, lat, lon, 1)[0];
    if (!hit) continue;
    const id = "nb-" + g.key;
    list.insertAdjacentHTML("beforeend",
      '<div class="step" style="margin-bottom:8px">' +
        '<span class="n">' + g.icon + "</span>" +
        "<div style=\"flex:1\">" +
          "<b>" + (hit.name || L.unnamed) + "</b>" +
          "<p>" + g.label + " · " + n(hit.km.toFixed(1)) + " " + L.km + " " + L.direct +
            ' <span id="' + id + '"></span></p>' +
        "</div>" +
        '<button class="btn ghost" style="padding:7px 12px;font-size:11.5px" data-route="' +
          hit.lat + "," + hit.lon + '">' + L.showRoute + "</button>" +
      "</div>");

    // Fetch the road answer in the background; the straight-line figure is
    // already on screen so the panel is useful before OSRM replies.
    route(lat, lon, hit.lat, hit.lon).then((r) => {
      const span = document.getElementById(id);
      if (span && r) {
        span.innerHTML = ' · <b style="color:var(--ember)">' + n(r.min) + " " + L.min +
                         "</b> " + L.driveTime + " (" + n(r.km) + " " + L.km + ")";
      }
    });
  }

  list.querySelectorAll("[data-route]").forEach((b) =>
    b.addEventListener("click", async (ev) => {
      ev.preventDefault();
      const [dlat, dlon] = b.dataset.route.split(",").map(Number);
      b.disabled = true;
      const r = await route(lat, lon, dlat, dlon);
      b.disabled = false;
      if (!r) return;
      drawRoute(r.geometry);
      const cs = r.geometry.coordinates;
      const lons = cs.map((c) => c[0]), lats = cs.map((c) => c[1]);
      map.fitBounds([[Math.min(...lons), Math.min(...lats)],
                     [Math.max(...lons), Math.max(...lats)]],
                    { padding: 45, duration: 800 });
    }));
}

function setPoint(lat, lon) {
  picked = { lat, lon };
  document.getElementById("coords").textContent = lat.toFixed(4) + ", " + lon.toFixed(4);
  document.getElementById("submit").disabled = false;

  if (marker) marker.remove();
  const el = document.createElement("div");
  el.className = "fmark big";
  el.innerHTML = '<div class="ring"></div><div class="core"></div>';
  marker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);

  showNearby(lat, lon);
}

function renderKinds() {
  const L = T();
  document.getElementById("kinds").innerHTML = KINDS.map((k) =>
    '<label class="choice"><input type="radio" name="kind" value="' + k.v + '"' +
    (k.v === kind ? " checked" : "") + ">" + k.i + " " + L[k.k] + "</label>").join("");
  document.querySelectorAll('input[name="kind"]').forEach((r) =>
    r.addEventListener("change", () => { kind = r.value; }));
}

function redraw() {
  const L = T();
  document.title = L.reportPage + " · " + L.brand;
  document.getElementById("mapHint").textContent = L.pickHint;
  renderKinds();
  if (picked) showNearby(picked.lat, picked.lon);
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!picked) return;
  const L = T();
  const btn = document.getElementById("submit");
  const out = document.getElementById("result");
  btn.disabled = true;
  btn.textContent = L.sending;

  try {
    const res = await fetch("/api/v1/reports", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        lat: picked.lat, lon: picked.lon, kind,
        note: document.getElementById("note").value || null,
        commune: document.getElementById("commune").value || null,
        contact: document.getElementById("contact").value || null,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();

    const sat = d.satellite;
    let msg = "<b>" + L.reportOk + "</b> #" + n(d.id);
    if (sat.confirmed && !sat.is_simulated) {
      msg += "<br>" + L.satConfirmed + " (" + n(sat.nearest_km) + " " + L.km + ").";
    } else if (!sat.is_simulated) {
      msg += "<br>" + L.satNone;
    }
    out.innerHTML = '<div class="notice ok">' + msg + "</div>";
    document.getElementById("form").reset();
  } catch (err) {
    // Static hosting has no API; say so plainly instead of showing a raw error.
    out.innerHTML = '<div class="notice danger"><b>' + L.reportFail + "</b> — " +
      L.needServer + "</div>";
  } finally {
    btn.disabled = false;
    btn.textContent = L.send;
  }
});

document.getElementById("geoBtn").addEventListener("click", (e) => {
  e.preventDefault();
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      setPoint(pos.coords.latitude, pos.coords.longitude);
      map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 12 });
    },
    () => { /* denied or unavailable; the map click still works */ },
    { enableHighAccuracy: true, timeout: 10000 });
});

(async function () {
  initPage({ redraw });
  redraw();

  const style = await darkBasemapStyle();
  try {
    if (maplibregl.getRTLTextPluginStatus() === "unavailable") {
      await maplibregl.setRTLTextPlugin(
        "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js", false);
    }
  } catch (e) { /* labels degrade, map still works */ }

  map = new maplibregl.Map({
    container: "map", style, center: [4.5, 36.4], zoom: 5.4,
    attributionControl: false,
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
  map.on("click", (e) => setPoint(e.lngLat.lat, e.lngLat.lng));

  try { ASSETS = await loadAssets(); } catch (err) { ASSETS = null; }
})();
</script>
</body>
</html>
