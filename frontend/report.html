<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بلّغ عن حريق · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap wrap-narrow">
  <div class="page-head">
    <h1 data-i18n="reportPage">بلّغ عن حريق</h1>
    <p data-i18n="reportLede"></p>
  </div>

  <div class="notice danger">
    <b data-i18n="callFirst">اتصل بـ 14 أولًا</b> —
    <span data-ar="الحماية المدنية 14 أو 1021 · الدرك 1055. هذا الموقع لا يُرسل نداء نجدة."
          data-fr="Protection civile 14 ou 1021 · Gendarmerie 1055. Ce site n'envoie pas d'appel de secours."></span>
  </div>

  <div class="card">
    <h3 data-i18n="pickLocation">حدّد الموقع على الخريطة</h3>
    <p class="hint" style="font-size:11.5px;color:var(--txt-faint);margin-bottom:11px" data-i18n="pickHint"></p>
    <div class="minimap" id="map">
      <div class="minimap-hint" id="mapHint"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
      <button class="btn ghost" id="geoBtn" data-i18n="useMyLocation">استعمل موقعي</button>
      <span id="coords" style="font-size:11.5px;color:var(--txt-faint);align-self:center"></span>
      <span id="routeInfo" class="routeinfo"></span>
    </div>
  </div>

  <div id="nearby"></div>

  <form class="card" id="form">
    <h3 data-i18n="kind">نوع البلاغ</h3>
    <div class="choices" id="kinds" style="margin-bottom:16px"></div>

    <div class="field">
      <label data-i18n="noteLabel">وصف مختصر</label>
      <textarea id="note" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label data-i18n="communeLabel">البلدية</label>
      <input id="commune" maxlength="120">
    </div>
    <div class="field">
      <label data-i18n="contactLabel">هاتف للتواصل (اختياري)</label>
      <input id="contact" maxlength="120" inputmode="tel">
      <div class="hint" data-i18n="contactHint"></div>
    </div>

    <button class="btn" id="submit" type="submit" disabled data-i18n="send">أرسل البلاغ</button>
    <div id="result" style="margin-top:14px"></div>
  </form>
</div>

<footer class="foot">
  <span data-ar="البلاغات تُخزَّن محليًا وتُقارن آليًا برصد الأقمار الاصطناعية. لا يُنشر رقم هاتفك أبدًا."
        data-fr="Les signalements sont stockés localement et recoupés automatiquement avec les détections satellite. Votre numéro n'est jamais publié."></span>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/config.js?v=10"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/basemap.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/routemap.js?v=10"></script>
<script>
let RM = null, ASSETS = null;
let picked = null, kind = "smoke";

const KINDS = [
  { v: "smoke", i: "🌫️", k: "kindSmoke" },
  { v: "fire",  i: "🔥", k: "kindFire" },
  { v: "help",  i: "🆘", k: "kindHelp" },
  { v: "road",  i: "🚧", k: "kindRoad" },
];

const GROUPS = [
  { key: "hospital",     icon: "🏥", labelKey: "hospitalKind" },
  { key: "fire_station", icon: "🚒", labelKey: "stationKind" },
  { key: "aid",          icon: "🤝", labelKey: "aidOrg" },
];

function nearestOf(kindKey, lat, lon) {
  const items = (ASSETS && ASSETS.assets[kindKey]) || [];
  return items
    .filter((x) => x.lat && x.lon)
    .map((x) => ({ ...x, km: kmBetween(lat, lon, x.lat, x.lon) }))
    .sort((a, b) => a.km - b.km)[0];
}

function showNearby() {
  const L = T();
  const box = document.getElementById("nearby");
  if (!RM || !RM.here || !ASSETS) { box.innerHTML = ""; return; }
  const here = RM.here;

  box.innerHTML = '<div class="card"><h3>' + L.nearbyHelp + '</h3><div class="needlist">' +
    GROUPS.map((g) => {
      const hit = nearestOf(g.key, here.lat, here.lon);
      if (!hit) return "";
      return '<div class="need u-norm">' +
        '<div class="need-h"><b>' + g.icon + " " + (hit.name || L.unnamed) + "</b></div>" +
        '<div class="need-w">' + L[g.labelKey] + " · " + n(hit.km.toFixed(1)) + " " +
          L.km + " " + L.direct + "</div>" +
        '<div class="need-f"><span class="need-st"></span>' +
          '<button class="btn ghost route" data-lat="' + hit.lat + '" data-lon="' + hit.lon +
          '" data-i="' + g.icon + '" data-name="' + (hit.name || "").replace(/"/g, "&quot;") +
          '">' + L.showRoute + "</button></div></div>";
    }).join("") + "</div></div>";

  document.querySelectorAll(".route").forEach((b) =>
    b.addEventListener("click", async () => {
      const res = await RM.route({ lat: +b.dataset.lat, lon: +b.dataset.lon,
                                   name: b.dataset.name, icon: b.dataset.i },
                                 { min: L.min, km: L.km, by: L.driveTime });
      if (res.error === "no-route") {
        document.getElementById("routeInfo").textContent = L.noRoute;
      }
    }));
}

function setPoint(lat, lon) {
  picked = { lat, lon };
  document.getElementById("coords").textContent = lat.toFixed(4) + ", " + lon.toFixed(4);
  document.getElementById("submit").disabled = false;
  showNearby();
}

function renderKinds() {
  const L = T();
  document.getElementById("kinds").innerHTML = KINDS.map((k) =>
    '<label class="choice"><input type="radio" name="kind" value="' + k.v + '"' +
    (k.v === kind ? " checked" : "") + ">" + k.i + " " + L[k.k] + "</label>").join("");
  document.querySelectorAll('input[name="kind"]').forEach((r) =>
    r.addEventListener("change", () => { kind = r.value; }));
}

function redraw() {
  const L = T();
  document.title = L.reportPage + " · " + L.brand;
  document.getElementById("geoBtn").textContent = L.useMyLocation;
  if (RM) RM.hint(RM.here ? L.chooseDest : L.pickHint);
  renderKinds();
  showNearby();
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!picked) return;
  const L = T();
  const btn = document.getElementById("submit");
  const out = document.getElementById("result");
  btn.disabled = true;
  btn.textContent = L.sending;

  try {
    const res = await fetch("/api/v1/reports", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        lat: picked.lat, lon: picked.lon, kind,
        note: document.getElementById("note").value || null,
        commune: document.getElementById("commune").value || null,
        contact: document.getElementById("contact").value || null,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    const sat = d.satellite;
    let msg = "<b>" + L.reportOk + "</b> #" + n(d.id);
    if (sat.confirmed && !sat.is_simulated) {
      msg += "<br>" + L.satConfirmed + " (" + n(sat.nearest_km) + " " + L.km + ").";
    } else if (!sat.is_simulated) {
      msg += "<br>" + L.satNone;
    }
    out.innerHTML = '<div class="notice ok">' + msg + "</div>";
    document.getElementById("form").reset();
  } catch (err) {
    // Static hosting has no API. Say so plainly rather than showing a raw error.
    out.innerHTML = '<div class="notice danger"><b>' + L.reportFail + "</b> — " +
      L.needServer + "</div>";
  } finally {
    btn.disabled = false;
    btn.textContent = L.send;
  }
});

(async function () {
  initPage({ redraw });

  RM = createRouteMap({
    container: "map", hintId: "mapHint", infoId: "routeInfo",
    center: [4.5, 36.4], zoom: 5.4,
    onLocate: (h) => setPoint(h.lat, h.lon),
  });

  document.getElementById("geoBtn").addEventListener("click", (e) => {
    e.preventDefault();
    RM.locateMe(() => RM.hint(T().locationDenied));
  });

  redraw();

  const style = await basemapStyle();
  try {
    if (maplibregl.getRTLTextPluginStatus() === "unavailable") {
      await maplibregl.setRTLTextPlugin(
        "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js", false);
    }
  } catch (e) { /* labels degrade, map still works */ }

  await RM.init(style);
  // Tapping anywhere on the map is the primary way to place a report.
  RM.map.on("click", (e) => setPoint(e.lngLat.lat, e.lngLat.lng));

  try { ASSETS = await loadAssets(); } catch (err) { ASSETS = null; }
  redraw();
})();
</script>
</body>
</html>
