<div class="wrap wrap-narrow">
  <div class="page-head">
    <h1 data-ar="كيف يعمل راصد" data-fr="Comment fonctionne Rased"></h1>
    <p data-ar="نظام مفتوح المصدر يحسب خطر اندلاع الحرائق قبل وقوعها عبر ولايات الجزائر الـ48، ويربط البؤر النشطة بالسكان القريبين منها وبأقرب فرق التدخّل."
       data-fr="Un système ouvert qui calcule le danger d'incendie avant qu'il ne se déclare sur les 48 wilayas, et relie les foyers actifs aux populations proches et aux moyens de secours les plus proches."></p>
  </div>

  <div class="card">
    <h3 data-ar="المؤشر" data-fr="L'indice"></h3>
    <div class="prose">
      <p data-ar="راصد يستعمل <b>مؤشر الطقس الحرائقي الكندي (FWI)</b> — نفس منظومة المعادلات التي تشغّلها أوروبا عبر EFFIS في حوض البحر المتوسط. ليست صيغة مبتكرة هنا، بل معيار منشور ومُتحقَّق منه منذ 1987."
         data-fr="Rased utilise l'<b>Indice Forêt-Météo canadien (FWI)</b> — le même jeu d'équations que l'Europe exploite via EFFIS sur le bassin méditerranéen. Ce n'est pas une formule inventée ici, mais un standard publié et validé depuis 1987."></p>
      <p data-ar="التنفيذ في راصد يُعيد إنتاج المثال المرجعي المنشور في تقرير Van Wagner بدقّة أربعة أرقام عشرية. هذا شرط أدنى: نظام يقول لأهل قرية إنّ الوضع خطير يجب أن يكون حسابه قابلًا للتحقّق."
         data-fr="L'implémentation reproduit l'exemple de référence publié par Van Wagner à quatre décimales près. C'est un minimum : un système qui dit à un village que la situation est dangereuse doit être vérifiable."></p>
    </div>

    <div class="tablewrap" style="margin-top:12px">
      <table class="data" style="min-width:520px">
        <thead><tr>
          <th data-ar="الرمز" data-fr="Code"></th>
          <th data-ar="ما يقيسه" data-fr="Ce qu'il mesure"></th>
          <th data-ar="زمن الاستجابة" data-fr="Temps de réponse"></th>
        </tr></thead>
        <tbody>
          <tr><td><b>FFMC</b></td><td data-ar="رطوبة الوقود الدقيق: أوراق وأعشاب يابسة" data-fr="Humidité des combustibles fins : feuilles, herbes sèches"></td><td data-ar="أقل من يوم" data-fr="moins d'un jour"></td></tr>
          <tr><td><b>DMC</b></td><td data-ar="رطوبة الطبقة العضوية المتوسطة" data-fr="Humidité de la couche organique intermédiaire"></td><td data-ar="نحو 12 يومًا" data-fr="environ 12 jours"></td></tr>
          <tr><td><b>DC</b></td><td data-ar="الجفاف العميق — ذاكرة الموسم كلّه" data-fr="Sécheresse profonde — la mémoire de toute la saison"></td><td data-ar="نحو 52 يومًا" data-fr="environ 52 jours"></td></tr>
          <tr><td><b>ISI</b></td><td data-ar="سرعة انتشار الجبهة (FFMC مع الرياح)" data-fr="Vitesse de propagation (FFMC et vent)"></td><td>—</td></tr>
          <tr><td><b>BUI</b></td><td data-ar="كمية الوقود المتاحة للاحتراق" data-fr="Quantité de combustible disponible"></td><td>—</td></tr>
          <tr><td><b>FWI</b></td><td data-ar="شدّة الحريق المتوقّعة" data-fr="Intensité de feu attendue"></td><td>—</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3 data-ar="أمران أهمّ من المعادلات" data-fr="Deux choses plus importantes que les équations"></h3>
    <div class="prose">
      <p data-ar="<b>تراكم الرطوبة (72 يومًا).</b> مؤشرات الرطوبة تحمل ذاكرة: جفاف اليوم نتيجة جوان وجويلية، لا نتيجة ساعة. لذلك تُحسب السلسلة عبر كل التاريخ المتاح قبل إصدار أول يوم توقّع. الانطلاق من الصفر اليوم يعطي «غابة رطبة» في وسط جفاف دام شهرين."
         data-fr="<b>Le spin-up (72 jours).</b> Les indices d'humidité ont une mémoire : la sécheresse d'aujourd'hui est le produit de juin et juillet, pas d'une heure. La chaîne est donc intégrée sur tout l'historique disponible avant d'émettre le premier jour de prévision. Un démarrage à froid décrirait une forêt humide au milieu de deux mois de sécheresse."></p>
      <p data-ar="<b>تعديل بالغطاء النباتي.</b> مؤشر FWI مؤشر <i>طقس</i> بحت. يوم جويلية في أدرار يسجّل «أقصى» بالحرارة والرطوبة وحدهما، بينما لا يوجد ما يحمل النار أصلًا. لذلك تُصنَّف كل ولاية غابات أو سهوب أو صحراء ويُعدَّل المؤشر تبعًا لذلك. خريطة بلا هذا التعديل تصبغ الصحراء بالأحمر وتفقد مصداقيتها من النظرة الأولى."
         data-fr="<b>La pondération par la végétation.</b> Le FWI est un indice purement <i>météorologique</i>. Une journée de juillet à Adrar atteint « extrême » par la seule chaleur et sécheresse, alors qu'il n'y a rien pour porter le feu. Chaque wilaya est donc classée forêt, steppe ou désert, et l'indice pondéré en conséquence. Sans cela, la carte peindrait le Sahara en rouge et perdrait toute crédibilité au premier regard."></p>
    </div>
  </div>

  <div class="card">
    <h3 data-ar="مصادر البيانات" data-fr="Sources de données"></h3>
    <div id="sources" class="grid2"></div>
  </div>

  <div class="card">
    <h3 data-ar="حدود النظام — بصراحة" data-fr="Limites du système — franchement"></h3>
    <div class="prose">
      <ul>
        <li data-ar="<b>الأقمار لا تسبق الإنسان.</b> زمن وصول رصد الأقمار خارج أمريكا الشمالية يتراوح بين ساعة وثلاث. الجار الذي يرى الدخان أسرع دائمًا. قيمة راصد في <i>الصورة الكاملة</i> و<i>التوقّع</i>، لا في أن يكون أول من يرى."
            data-fr="<b>Le satellite ne devance pas l'humain.</b> Hors Amérique du Nord, la latence des détections est de une à trois heures. Le voisin qui voit la fumée est toujours plus rapide. La valeur de Rased est dans la <i>vue d'ensemble</i> et la <i>prévision</i>, pas dans la primeur."></li>
        <li data-ar="<b>أعداد السكان تقديرية.</b> OpenStreetMap يحمل وسم السكان لنحو 9٪ فقط من التجمّعات الجزائرية؛ الباقي يُقدَّر حسب حجم التجمّع. الأرقام صالحة <i>لترتيب الأولويات</i> لا للإحصاء."
            data-fr="<b>Les populations sont estimées.</b> OpenStreetMap ne porte le tag population que pour environ 9 % des localités algériennes ; le reste est estimé selon la taille. Ces chiffres servent à <i>hiérarchiser</i>, pas à recenser."></li>
        <li data-ar="<b>نقطة قياس واحدة لكل ولاية.</b> الطقس يُؤخذ من مركز الولاية، وهو تبسيط واضح في الولايات الكبيرة. القياس على مستوى البلديات هو الخطوة التالية."
            data-fr="<b>Un seul point de mesure par wilaya.</b> La météo est prise au centroïde, simplification évidente pour les grandes wilayas. L'échantillonnage par commune est l'étape suivante."></li>
        <li data-ar="<b>لا نملك بيانات تدخّل الحماية المدنية.</b> أعداد الأعوان والوسائل المنتشرة تُنشر في بيانات صحفية لا في واجهة برمجية مفتوحة، ولا يقوم راصد باختلاقها."
            data-fr="<b>Nous n'avons pas les données d'engagement de la Protection civile.</b> Les effectifs et moyens déployés sont publiés en communiqués, pas via une API ouverte, et Rased ne les invente pas."></li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3 data-ar="العلاقة بمنصّات الإغاثة" data-fr="Rapport avec les plateformes de secours"></h3>
    <div class="prose">
      <p data-ar="منصّة <b>هبة الجزائر</b> تنسّق المساعدات العينية <i>بعد</i> الحريق. راصد يعمل <i>قبله وأثناءه</i>، ولا ينافسها: قاعدة بياناتها تحتوي على حالة اسمها «غير مؤكَّد» تعني بلاغًا من مواقع التواصل لم يُتحقَّق منه — وهذا بالضبط ما تجيب عنه واجهة راصد آليًا: هل يوجد رصد حراري قرب هذه النقطة خلال الساعات الماضية؟"
         data-fr="La plateforme <b>Hiba Algeria</b> coordonne l'aide en nature <i>après</i> l'incendie. Rased agit <i>avant et pendant</i>, sans la concurrencer : sa base contient un statut « non confirmé » désignant un signalement issu des réseaux sociaux — c'est exactement ce que l'API de Rased tranche automatiquement : existe-t-il une détection thermique près de ce point ces dernières heures ?"></p>
    </div>
    <pre class="code">GET /api/v1/confirm?lat=36.81&amp;lon=5.77&amp;radius_km=5&amp;hours=24
GET /api/v1/risk?code=18
GET /api/v1/fires
GET /api/v1/exposure
GET /api/v1/affected-candidates</pre>
  </div>

  <div class="notice danger">
    <span data-ar="<b>راصد ليس أمر إخلاء.</b> هو أداة توعية وتخطيط واستعداد. القرار الميداني — الإخلاء، غلق الطرق، توجيه الفرق — من صلاحية الحماية المدنية وحدها. الطوارئ: 14 أو 1021."
          data-fr="<b>Rased n'est pas un ordre d'évacuation.</b> C'est un outil de sensibilisation, de planification et de préparation. La décision opérationnelle — évacuer, fermer une route, engager des moyens — relève de la seule Protection civile. Urgences : 14 ou 1021."></span>
  </div>
</div>

<script>
const SOURCES = [
  { n: "Open-Meteo",    ar: "الطقس والتوقّعات", fr: "Météo et prévisions",   free: true },
  { n: "NASA FIRMS",    ar: "البؤر الحرارية",   fr: "Foyers thermiques",     free: false },
  { n: "OpenStreetMap", ar: "التجمّعات، الحماية المدنية، المستشفيات، الجمعيات", fr: "Localités, casernes, hôpitaux, associations", free: true },
  { n: "geoBoundaries", ar: "حدود الولايات (ODbL)", fr: "Limites des wilayas (ODbL)", free: true },
  { n: "OSRM",          ar: "حساب المسارات على الطرق الحقيقية", fr: "Calcul d'itinéraires routiers réels", free: true },
  { n: "OpenFreeMap",   ar: "خلفية الخريطة", fr: "Fond cartographique", free: true },
];

function redraw() {
  const freeAr = "مجاني · بدون مفتاح", freeFr = "gratuit · sans clé";
  const keyAr = "يتطلّب مفتاحًا مجانيًا", keyFr = "clé gratuite requise";
  document.getElementById("sources").innerHTML = SOURCES.map((s) =>
    '<div class="stat" style="padding:12px 14px">' +
      '<b style="font-size:14px">' + s.n + "</b>" +
      "<span>" + (isAr() ? s.ar : s.fr) + "</span>" +
      '<span style="color:' + (s.free ? "#4fd1a5" : "#f0c761") + ';margin-top:4px">' +
        (s.free ? (isAr() ? freeAr : freeFr) : (isAr() ? keyAr : keyFr)) + "</span>" +
    "</div>").join("");
}
initPage({ redraw });
redraw();
</script>
