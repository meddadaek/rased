<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراكز الإيواء · راصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/style.css?v=10" rel="stylesheet">
<link href="css/pages.css?v=10" rel="stylesheet">
<link href="css/home.css?v=10" rel="stylesheet">
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="page-head">
    <h1 data-ar="مراكز الإيواء" data-fr="Centres d'hébergement"></h1>
    <p data-ar="أماكن تستقبل العائلات التي أُجليت. اضغط «الطريق» لرسم المسار من موقعك إلى المركز على الخريطة مباشرة."
       data-fr="Lieux accueillant les familles évacuées. Appuyez sur « Itinéraire » pour tracer le trajet depuis votre position jusqu'au centre, directement sur la carte."></p>
  </div>

  <div class="notice">
    <span data-ar="<b>موثّق ≠ مقترح.</b> «موثّق» يعني أن فريقًا ميدانيًا أكّده (مصدر: منصة سند). «مقترح» يعني أنه مبنى من النوع الذي يُفتح عادةً عند الإجلاء — لم يتحقّق منه أحد بعد. اتصل قبل أن ترسل عائلة إلى أي مكان."
          data-fr="<b>Vérifié ≠ proposé.</b> « Vérifié » signifie qu'une équipe de terrain l'a confirmé (source : plateforme Sanad). « Proposé » signifie un bâtiment du type habituellement ouvert lors d'une évacuation, que personne n'a encore vérifié. Téléphonez avant d'y envoyer une famille."></span>
  </div>

  <div class="grid4" id="stats" style="margin-bottom:16px"></div>

  <div class="card" style="padding:0;overflow:hidden">
    <div class="minimap" id="map" style="height:400px;border:0;border-radius:0">
      <div class="minimap-hint" id="mapHint"></div>
    </div>
    <div class="maptools">
      <button class="btn" id="geoBtn"></button>
      <button class="btn ghost" id="pickBtn"></button>
      <button class="btn ghost" id="clearBtn" hidden></button>
      <span id="routeInfo" class="routeinfo"></span>
    </div>
  </div>
  <p class="privacy" id="privacy" style="margin:-6px 0 18px"></p>

  <div class="toolbar">
    <select class="wsel" id="wilayaSel"></select>
    <div class="segs" id="statusSegs"></div>
    <button class="btn" id="addBtn" data-ar="سجّل مركزًا" data-fr="Déclarer un centre"></button>
  </div>

  <div class="card" id="addCard" hidden>
    <h3 data-ar="سجّل مركز إيواء" data-fr="Déclarer un centre d'hébergement"></h3>
    <p class="privacy" id="trustHelp" style="margin-bottom:12px"></p>
    <form id="shForm">
      <div class="grid2">
        <div class="field">
          <label data-ar="اسم المركز" data-fr="Nom du centre"></label>
          <input id="fName" maxlength="160" required>
        </div>
        <div class="field">
          <label data-ar="الولاية" data-fr="Wilaya"></label>
          <select id="fWilaya"></select>
        </div>
        <div class="field">
          <label data-ar="البلدية" data-fr="Commune"></label>
          <input id="fCommune" maxlength="120">
        </div>
        <div class="field">
          <label data-ar="العنوان" data-fr="Adresse"></label>
          <input id="fAddress" maxlength="300">
        </div>
        <div class="field">
          <label data-ar="الطاقة الاستيعابية" data-fr="Capacité"></label>
          <input id="fCapacity" type="number" min="0" max="100000">
        </div>
        <div class="field">
          <label data-ar="هاتف المركز" data-fr="Téléphone du centre"></label>
          <input id="fPhone" maxlength="60" inputmode="tel">
        </div>
      </div>
      <div class="field">
        <label data-ar="ملاحظات" data-fr="Notes"></label>
        <textarea id="fNotes" maxlength="600"></textarea>
      </div>
      <button class="btn" type="submit" data-ar="أرسل" data-fr="Envoyer"></button>
      <span id="addMsg" style="margin-inline-start:10px;font-size:12px"></span>
    </form>
  </div>

  <div id="content"><div class="loading">…</div></div>
</div>

<footer class="foot">
  <span data-ar="المراكز الموثّقة: منصة سند (Quanta Club) عبر هبة الجزائر · المقترحة: OpenStreetMap · المسارات: OSRM"
        data-fr="Centres vérifiés : plateforme Sanad (Quanta Club) via Hiba Algeria · Proposés : OpenStreetMap · Itinéraires : OSRM"></span>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/basemap.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/routemap.js?v=10"></script>
<script>
let SHELTERS = null, GEO = null, RM = null;
let fWilaya = "", fStatus = "";

const STATUSES = [
  { v: "",          ar: "الكل",     fr: "Tous" },
  { v: "open",      ar: "موثّقة",   fr: "Vérifiés" },
  { v: "candidate", ar: "مقترحة",   fr: "Proposés" },
];

const KINDS = { school: { ar: "مدرسة", fr: "École" },
                community: { ar: "دار شباب / مركز", fr: "Maison de jeunes" },
                coordination: { ar: "خلية تنسيق", fr: "Cellule de coordination" },
                shelter: { ar: "مركز إيواء", fr: "Centre d'hébergement" } };

const wname = (code) => {
  const g = GEO && GEO.features.find((x) => x.properties.code === code);
  return g ? wilayaName(g.properties) : "—";
};

const api = (path, opts) => fetch("/api/v1" + path, opts).then((r) => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
});

function shelterGeoJSON(rows) {
  return { type: "FeatureCollection", features: rows.filter((s) => s.lat && s.lon)
    .map((s) => ({ type: "Feature",
      geometry: { type: "Point", coordinates: [s.lon, s.lat] },
      properties: { id: s.id, name: s.name, phone: s.phone || "",
                    trust: s.trust || "reported" } })) };
}

function addLayer() {
  RM.map.addSource("shelters", { type: "geojson", data: shelterGeoJSON(visible()) });
  RM.map.addLayer({
    id: "shelters", type: "circle", source: "shelters",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 5, 4, 12, 10],
      // Trust is encoded in fill, and repeated as a text badge in the list — so
      // it is never carried by colour alone.
      "circle-color": ["match", ["get", "trust"],
        "verified", "#12A594", "confirmed", "#5BBFA8",
        "disputed", "#C01818", "#9AA8A2"],
      "circle-stroke-width": 2,
      "circle-stroke-color": "#ffffff",
      "circle-opacity": 0.94,
    },
  });
  RM.map.on("mouseenter", "shelters", () => { RM.map.getCanvas().style.cursor = "pointer"; });
  RM.map.on("mouseleave", "shelters", () => { RM.map.getCanvas().style.cursor = ""; });
  RM.map.on("click", "shelters", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ offset: 12, maxWidth: "260px" }).setLngLat(e.lngLat)
      .setHTML('<div class="pop-kind"><i style="background:#12A594"></i>' +
        (isAr() ? "مركز إيواء" : "Hébergement") + "</div>" +
        '<div class="pop-name">' + p.name + "</div>" +
        (p.phone ? '<div class="pop-meta"><a href="tel:' + p.phone + '">☎ ' + p.phone + "</a></div>" : ""))
      .addTo(RM.map);
  });
}

/* Self-healing: every render either updates the layer or creates it.

   Relying on a single well-ordered call at boot proved fragile — one silent
   rejection anywhere earlier in the async chain and the map stays empty forever
   with no error on screen. Making the layer a property of "having rendered"
   rather than of "having booted correctly" removes that whole class of failure. */
function refreshLayer() {
  if (!RM || !RM.map) return;
  const src = RM.map.getSource("shelters");
  if (src) {
    src.setData(shelterGeoJSON(visible()));
    return;
  }
  try {
    addLayer();
  } catch (e) {
    // Style not ready yet; the next render will try again.
  }
}

function visible() {
  if (!SHELTERS) return [];
  return SHELTERS.shelters.filter((s) =>
    (!fStatus || s.status === fStatus) && (!fWilaya || s.wilaya === fWilaya));
}

function renderSegs() {
  document.getElementById("statusSegs").innerHTML = STATUSES.map((s) =>
    '<button class="seg' + (s.v === fStatus ? " on" : "") + '" data-v="' + s.v + '">' +
    (isAr() ? s.ar : s.fr) + "</button>").join("");
  document.querySelectorAll("#statusSegs .seg").forEach((b) =>
    b.addEventListener("click", () => { fStatus = b.dataset.v; render(); }));
}

function fillWilayaSelects() {
  if (!GEO) return;
  const opts = GEO.features.slice()
    .sort((a, b) => wilayaName(a.properties).localeCompare(wilayaName(b.properties)))
    .map((g) => '<option value="' + g.properties.code + '">' +
      wilayaName(g.properties) + "</option>").join("");
  const sel = document.getElementById("wilayaSel");
  sel.innerHTML = '<option value="">' + (isAr() ? "كل الولايات" : "Toutes les wilayas") +
    "</option>" + opts;
  sel.value = fWilaya;
  const f = document.getElementById("fWilaya");
  const cur = f.value;
  f.innerHTML = '<option value="">—</option>' + opts;
  f.value = cur;
}

function render() {
  const L = T();
  renderSegs();
  refreshLayer();

  const all = SHELTERS ? SHELTERS.shelters : [];
  const verified = all.filter((s) => s.trust === "verified").length;
  const disputed = all.filter((s) => s.trust === "disputed").length;
  const withPhone = all.filter((s) => s.phone).length;

  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>' + n(all.length) + "</b><span>" +
      (isAr() ? "مركز مدرَج" : "centres listés") + "</span></div>" +
    '<div class="stat good"><b>' + n(verified) + "</b><span>" +
      (isAr() ? "موثّقة ميدانيًا" : "vérifiés sur le terrain") + "</span></div>" +
    '<div class="stat"><b>' + n(withPhone) + "</b><span>" +
      (isAr() ? "برقم هاتف" : "avec téléphone") + "</span></div>" +
    '<div class="stat ' + (disputed ? "danger" : "") + '"><b>' + n(disputed) + "</b><span>" +
      (isAr() ? "محلّ نزاع" : "contestés") + "</span></div>";

  let rows = visible();
  if (RM && RM.here) {
    rows = rows.map((s) => ({ ...s,
      km: s.lat ? kmBetween(RM.here.lat, RM.here.lon, s.lat, s.lon) : Infinity }))
      .sort((a, b) => a.km - b.km);
  } else {
    rows = rows.slice().sort((a, b) =>
      (b.trust === "verified") - (a.trust === "verified"));
  }

  const box = document.getElementById("content");
  if (!rows.length) { box.innerHTML = '<div class="card"><p class="none">—</p></div>'; return; }

  box.innerHTML = '<div class="needlist">' + rows.slice(0, 200).map((s) => {
    const kind = KINDS[s.kind] || KINDS.shelter;
    return '<div class="need u-norm' + (s.trust === "verified" ? "" : " shelter-cand") + '">' +
      '<div class="need-h"><b>' + s.name + "</b>" + trustBadge(s.trust, L) + "</div>" +
      '<div class="need-w">' + (isAr() ? kind.ar : kind.fr) + " · " + wname(s.wilaya) +
        (s.commune ? " · " + s.commune : "") +
        (s.km && s.km !== Infinity ? " · " + n(s.km.toFixed(1)) + " " + L.km : "") + "</div>" +
      (s.address ? '<div class="need-n">' + s.address + "</div>" : "") +
      (s.capacity ? '<div class="need-n">' + (isAr() ? "الطاقة: " : "Capacité : ") + nInt(s.capacity) + "</div>" : "") +
      '<div class="need-f">' +
        (s.phone ? '<a class="need-tel" href="tel:' + s.phone + '">☎ ' + s.phone + "</a>"
                 : '<span class="need-st">' + (isAr() ? "لا هاتف مسجّل" : "Aucun téléphone") + "</span>") +
        (s.lat ? '<button class="btn ghost route" data-lat="' + s.lat + '" data-lon="' + s.lon +
          '" data-name="' + (s.name || "").replace(/"/g, "&quot;") + '">' + L.showRoute + "</button>" : "") +
      "</div>" +
      '<div class="trustbar">' +
        '<span class="tcount">' + L.confirmsN.replace("{n}", n(s.confirms || 0)) +
          (s.disputes ? " · " + L.disputesN.replace("{n}", n(s.disputes)) : "") + "</span>" +
        (READONLY ? "" :
          '<button class="tbtn yes" data-conf="' + s.id + '" data-v="confirm">' + L.confirmBtn + "</button>" +
          '<button class="tbtn no" data-conf="' + s.id + '" data-v="dispute">' + L.disputeBtn + "</button>") +
      "</div></div>";
  }).join("") + "</div>";

  document.querySelectorAll(".route").forEach((b) =>
    b.addEventListener("click", async () => {
      const L2 = T();
      if (!RM.here) { RM.hint(L2.locateFirst); return; }
      const res = await RM.route({ lat: +b.dataset.lat, lon: +b.dataset.lon,
                                   name: b.dataset.name, icon: "🏠" },
                                 { min: L2.min, km: L2.km, by: L2.driveTime });
      document.getElementById("clearBtn").hidden = !!res.error;
      if (res.error === "no-route") document.getElementById("routeInfo").textContent = L2.noRoute;
    }));

  document.querySelectorAll("[data-conf]").forEach((b) =>
    b.addEventListener("click", () => vote(+b.dataset.conf, b.dataset.v)));
}

async function vote(id, verdict) {
  try {
    await api("/confirmations", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ entity: "shelter", entity_id: id, verdict }),
    });
    await load();
  } catch (e) { alert(T().needServer); }
}

/* API first, static export second. The static file is a supported deployment,
   not a failure mode — on Vercel there is no database, so the same verified
   records are served as flat JSON and the submission controls hide themselves. */
let READONLY = false;

async function load() {
  try {
    const live = await api("/shelters");
    if (live && live.shelters) { SHELTERS = live; READONLY = false; render(); return; }
    throw new Error("no api");
  } catch (e) {
    try {
      SHELTERS = await fetch("data/shelters.json").then((r) => r.json());
      READONLY = true;
      applyReadonly();
      render();
    } catch (err) {
      document.getElementById("content").innerHTML =
        '<div class="notice danger">' + T().needServer + "</div>";
    }
  }
}

function applyReadonly() {
  const btn = document.getElementById("addBtn");
  if (btn) btn.hidden = true;
  const card = document.getElementById("addCard");
  if (card) card.hidden = true;
}

function labels() {
  const L = T();
  document.getElementById("geoBtn").textContent = L.locateMe;
  document.getElementById("pickBtn").textContent = L.pickOnMap;
  document.getElementById("clearBtn").textContent = L.clearRoute;
  document.getElementById("privacy").textContent = L.privacyNote;
  document.getElementById("trustHelp").textContent = L.trustHelp;
  if (RM) RM.hint(RM.here ? L.chooseDest : L.locateFirst);
}

function redraw() { labels(); fillWilayaSelects(); render(); }

document.getElementById("addBtn").addEventListener("click", () => {
  const c = document.getElementById("addCard");
  c.hidden = !c.hidden;
});
document.getElementById("wilayaSel").addEventListener("change", (e) => {
  fWilaya = e.target.value; render();
});

document.getElementById("shForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("addMsg");
  const cap = document.getElementById("fCapacity").value;
  try {
    await api("/shelters", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("fName").value,
        wilaya: document.getElementById("fWilaya").value || null,
        commune: document.getElementById("fCommune").value || null,
        address: document.getElementById("fAddress").value || null,
        capacity: cap ? +cap : null,
        phone: document.getElementById("fPhone").value || null,
        notes: document.getElementById("fNotes").value || null,
      }),
    });
    msg.style.color = "var(--hope)";
    msg.textContent = isAr() ? "تم التسجيل — يحتاج تأكيدين ليُعرض كمؤكَّد."
                             : "Enregistré — deux confirmations nécessaires.";
    e.target.reset();
    await load();
  } catch (err) {
    msg.style.color = "#B01F1F";
    msg.textContent = T().needServer;
  }
});

(async function () {
  initPage({ redraw });

  RM = createRouteMap({
    container: "map", hintId: "mapHint", infoId: "routeInfo",
    center: [5.9, 36.6], zoom: 7.2,
    onLocate: () => { labels(); render(); },
  });

  document.getElementById("geoBtn").addEventListener("click", () =>
    RM.locateMe(() => RM.hint(T().locationDenied)));
  document.getElementById("pickBtn").addEventListener("click", () =>
    RM.pick(T().pickHintMap));
  document.getElementById("clearBtn").addEventListener("click", () => {
    RM.clearRoute();
    document.getElementById("clearBtn").hidden = true;
  });

  const style = await basemapStyle();
  try {
    if (maplibregl.getRTLTextPluginStatus() === "unavailable") {
      await maplibregl.setRTLTextPlugin(
        "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js", false);
    }
  } catch (e) { /* labels degrade, map still works */ }

  GEO = await loadWilayaGeo();
  await RM.init(style);
  await load();
  redraw();

  // Belt and braces: if the style was still settling during the first render,
  // keep retrying until the layer is on.
  RM.whenReady(() => { if (!RM.map.getSource("shelters")) addLayer(); })
    .catch((e) => console.warn("shelter layer:", e.message));
})();
</script>
</body>
</html>
